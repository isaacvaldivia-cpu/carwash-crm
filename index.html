<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Manager — Iniciar Sesión</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #1a1a2e; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-box { background: white; padding: 40px; border-radius: 12px; width: 360px; box-shadow: 0 20px 60px rgba(0,0,0,0.4); }
        .login-box h1 { text-align:center; font-size:22px; color:#1a1a2e; margin-bottom:6px; }
        .login-box p { text-align:center; color:#888; font-size:13px; margin-bottom:30px; }
        .field { margin-bottom:18px; }
        .field label { display:block; font-size:13px; font-weight:600; color:#444; margin-bottom:6px; }
        .field input { width:100%; padding:10px 14px; border:1px solid #ddd; border-radius:8px; font-size:15px; outline:none; transition:border 0.2s; }
        .field input:focus { border-color:#4f46e5; }
        button { width:100%; padding:12px; background:#4f46e5; color:white; border:none; border-radius:8px; font-size:16px; font-weight:600; cursor:pointer; }
        button:hover { background:#4338ca; }
        #error-msg { margin-top:14px; text-align:center; color:#e53e3e; font-size:13px; min-height:20px; }
        .version { text-align:center; margin-top:24px; font-size:11px; color:#bbb; }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>🏢 Business Manager</h1>
        <p>Inicie sesión en su cuenta</p>
        <div class="field">
            <label>Correo o Usuario</label>
            <input type="text" id="username" placeholder="correo@ejemplo.com" autocomplete="username" />
        </div>
        <div class="field">
            <label>Contraseña</label>
            <input type="password" id="password" placeholder="Ingrese su contraseña" autocomplete="current-password" />
        </div>
        <button onclick="login()">Iniciar Sesión</button>
        <div id="error-msg"></div>
        <div class="version">v2.0 — Cloud Edition</div>
    </div>
    <script type="module" src="auth.js"></script>
</body>
</html>
