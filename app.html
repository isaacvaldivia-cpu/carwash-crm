<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Manager</title>
    <script src="config.js"></script>
    <script src="js/crypto.js"></script>
    <script src="js/db.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f5f6fa;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        /* ---- SIDEBAR ---- */
        #sidebar {
            width: 220px;
            background: #1a1a2e;
            display: flex;
            flex-direction: column;
            padding: 0;
            flex-shrink: 0;
        }
        #sidebar-header {
            padding: 24px 20px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        #sidebar-header h1 {
            color: white;
            font-size: 15px;
            font-weight: 700;
            word-break: break-word;
        }
        #sidebar-logo {
            filter: brightness(1.1);
        }
        #sidebar-header p {
            color: #888;
            font-size: 11px;
            margin-top: 4px;
        }
        #sidebar-nav {
            flex: 1;
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .nav-btn {
            width: 100%;
            padding: 10px 14px;
            background: transparent;
            color: #ccc;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
        }
        .nav-btn:hover { background: rgba(255,255,255,0.08); color: white; }
        .nav-btn.active { background: #4f46e5; color: white; font-weight: 600; }
        #sidebar-footer {
            padding: 16px 12px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        #current-user {
            color: #888;
            font-size: 12px;
            margin-bottom: 10px;
            padding: 0 4px;
        }
        #logout-btn {
            width: 100%;
            padding: 9px 14px;
            background: rgba(255,255,255,0.06);
            color: #ccc;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
        }
        #logout-btn:hover { background: #e53e3e; color: white; }
        /* ---- MAIN CONTENT ---- */
        #main-content { flex: 1; overflow-y: auto; padding: 30px; }
        /* ---- INVENTORY STYLES ---- */
        .stat-card {
            flex: 1;
            background: white;
            border-radius: 10px;
            padding: 16px 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .stat-number { font-size: 24px; font-weight: 700; color: #1a1a2e; }
        .stat-label { font-size: 12px; color: #888; margin-top: 4px; }
        .inv-row:hover { background: #f8f9fa; }
        .inv-row td { padding: 12px 16px; border-bottom: 1px solid #f0f0f0; font-size: 14px; }
        .badge-low { background: #fff5f5; color: #e53e3e; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .badge-ok { background: #f0fff4; color: #38a169; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .action-btn { padding: 6px 12px; border: none; border-radius: 6px; font-size: 12px; cursor: pointer; font-weight: 600; }
        .btn-edit { background: #ebf8ff; color: #3182ce; margin-right: 4px; }
        .btn-delete { background: #fff5f5; color: #e53e3e; }
        .btn-edit:hover { background: #3182ce; color: white; }
        .btn-delete:hover { background: #e53e3e; color: white; }
        /* ---- SETTINGS STYLES ---- */
        .settings-card { background: white; border-radius: 12px; padding: 24px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .settings-card-title { font-size: 15px; font-weight: 700; color: #1a1a2e; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid #f0f0f0; }
        .settings-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #f9f9f9; }
        .settings-label { font-size: 13px; color: #888; }
        .settings-value { font-size: 14px; font-weight: 600; color: #1a1a2e; }
        .settings-field { margin-bottom: 16px; }
        .settings-field label { display: block; font-size: 13px; font-weight: 600; color: #444; margin-bottom: 6px; }
        .settings-field input, .settings-field select, .settings-field textarea {
            width: 100%; max-width: 400px; padding: 10px 14px;
            border: 1px solid #ddd; border-radius: 8px; font-size: 14px; outline: none; background: white;
        }
        .settings-field input:focus, .settings-field select:focus { border-color: #4f46e5; }
        .settings-btn-primary {
            padding: 10px 24px; background: #4f46e5; color: white;
            border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: background 0.2s;
        }
        .settings-btn-primary:hover { background: #4338ca; }
        /* ---- SERVICES TAB STYLES ---- */
        .svc-tab { padding: 9px 18px; border: 1px solid #ddd; border-radius: 8px; background: white; color: #444; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .svc-tab:hover { background: #f0f0f0; }
        .svc-tab.active { background: #4f46e5; color: white; border-color: #4f46e5; }
        /* ---- REPORT STYLES ---- */
        .report-card { background: white; border-radius: 12px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .report-card-title { font-size: 15px; font-weight: 700; color: #1a1a2e; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid #f0f0f0; }
        .report-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #f5f5f5; }
        .report-row:last-child { border-bottom: none; }
        /* ---- LOW STOCK BADGE ---- */
        .badge { background: #e53e3e; color: white; border-radius: 20px; font-size: 10px; font-weight: 700; padding: 2px 7px; margin-left: 6px; vertical-align: middle; }
        /* ---- LOW STOCK BANNER ---- */
        .low-stock-banner { background: #fff5f5; border: 1px solid #fed7d7; border-radius: 10px; padding: 14px 18px; margin-bottom: 20px; display: flex; align-items: center; gap: 12px; }
        .low-stock-banner .banner-icon { font-size: 22px; }
        .low-stock-banner .banner-text { flex: 1; }
        .low-stock-banner .banner-text strong { color: #c53030; font-size: 14px; display: block; }
        .low-stock-banner .banner-text span { color: #888; font-size: 12px; }
        .low-stock-banner .banner-link { color: #c53030; font-size: 12px; font-weight: 600; cursor: pointer; text-decoration: underline; }
    </style>
</head>
<body>
    <!-- SIDEBAR -->


    <div id="sidebar">
        <div id="sidebar-header">
            <div id="sidebar-logo-container" style="display:none;margin-bottom:10px;text-align:center;">
                <img id="sidebar-logo" src="" style="max-width:80px;max-height:50px;object-fit:contain;border-radius:6px;" />
            </div>
            <h1 id="sidebar-company-name">🏢 Business Manager</h1>
            <p>v1.0.0</p>
        </div>
        <div id="sidebar-nav"></div>
        <div id="sidebar-footer">
            <div id="current-user"></div>
            <button id="logout-btn" onclick="logout()">🚪 Cerrar Sesión</button>
        </div>
    </div>
    <!-- MAIN CONTENT AREA -->
    <div id="main-content"></div>

<!-- DASHBOARD MODULE -->
    <template id="tpl-dashboard">
        <div id="dashboard-module">

            <!-- Header -->
            <div style="margin-bottom:24px;">
                <h1 style="font-size:22px; color:#1a1a2e;">📈 Panel Principal</h1>
                <p style="color:#888; font-size:13px; margin-top:4px;" id="dash-welcome">Welcome back!</p>
            </div>

            <!-- Quick Stats -->
            <div style="display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:24px;">
                <div class="stat-card" style="border-left:4px solid #4f46e5;">
                    <div class="stat-number" id="dash-total-products">0</div>
                    <div class="stat-label">Total Productos</div>
                </div>
                <div class="stat-card" style="border-left:4px solid #e53e3e;">
                    <div class="stat-number" id="dash-low-stock" style="color:#e53e3e;">0</div>
                    <div class="stat-label">Productos con Poco Stock</div>
                </div>
                <div class="stat-card" style="border-left:4px solid #38a169;">
                    <div class="stat-number" id="dash-inventory-value">$0</div>
                    <div class="stat-label">Valor de Inventario</div>
                </div>
                <div class="stat-card" style="border-left:4px solid #d69e2e;">
                    <div class="stat-number" id="dash-service-revenue">$0</div>
                    <div class="stat-label">Ingresos por Servicios</div>
                </div>
            </div>

            <!-- Second row stats -->
            <div style="display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:24px;">
                <div class="stat-card" style="border-left:4px solid #805ad5;">
                    <div class="stat-number" id="dash-total-servicios">0</div>
                    <div class="stat-label">Total Servicios</div>
                </div>
                <div class="stat-card" style="border-left:4px solid #319795;">
                    <div class="stat-number" id="dash-total-sales">0</div>
                    <div class="stat-label">Total Ventas de Servicios</div>
                </div>
                <div class="stat-card" style="border-left:4px solid #dd6b20;">
                    <div class="stat-number" id="dash-total-movements">0</div>
                    <div class="stat-label">Movimientos de Stock</div>
                </div>
            </div>

            <!-- Two column layout -->
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:20px;">

                <!-- Stock Bajo Alert -->
                <div class="report-card">
                    <h2 class="report-card-title">🚨 Alerta de Stock Bajo</h2>
                    <div id="dash-low-stock-list"></div>
                </div>

                <!-- Servicio Principals -->
                <div class="report-card">
                    <h2 class="report-card-title">🏆 Servicios Principales</h2>
                    <div id="dash-top-servicios"></div>
                </div>

            </div>

            <!-- Two column layout row 2 -->
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px;">

                <!-- Recent Movimientos de Stock -->
                <div class="report-card">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; padding-bottom:12px; border-bottom:1px solid #f0f0f0;">
                        <h2 style="font-size:15px; font-weight:700; color:#1a1a2e;">🔄 Movimientos Recientes</h2>
                        <button onclick="loadModule(AppConfig.modules.find(m=>m.id==='movements'))" style="font-size:12px; color:#4f46e5; background:none; border:none; cursor:pointer; font-weight:600;">Ver Todo →</button>
                    </div>
                    <div id="dash-recent-movements"></div>
                </div>

                <!-- Recent Service Sales -->
                <div class="report-card">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; padding-bottom:12px; border-bottom:1px solid #f0f0f0;">
                        <h2 style="font-size:15px; font-weight:700; color:#1a1a2e;">💰 Ventas Recientes</h2>
                        <button onclick="loadModule(AppConfig.modules.find(m=>m.id==='servicios'))" style="font-size:12px; color:#4f46e5; background:none; border:none; cursor:pointer; font-weight:600;">Ver Todo →</button>
                    </div>
                    <div id="dash-recent-sales"></div>
                </div>

            </div>

        </div>
    </template>
<!-- INVENTORY MODULE -->
    <template id="tpl-inventory">
        <div id="inventory-module">
           <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                <div>
                    <h1 style="font-size:22px; color:#1a1a2e;">📦 Inventario</h1>
                    <p style="color:#888; font-size:13px; margin-top:4px;">Materiales, movimientos y cuentas por cobrar</p>
                </div>
                <div style="display:flex; gap:10px;" id="inv-header-buttons">
                    <button onclick="printInventoryReport()" style="padding:10px 20px; background:#1a1a2e; color:white; border:none; border-radius:8px; font-size:14px; font-weight:600; cursor:pointer;">🖨️ Imprimir</button>
                    <button onclick="showAddForm()" style="padding:10px 20px; background:#4f46e5; color:white; border:none; border-radius:8px; font-size:14px; font-weight:600; cursor:pointer;">+ Agregar Material</button>
                </div>
            </div>

            <!-- Inventory Tabs -->
            <div style="display:flex; gap:8px; margin-bottom:24px;">
                <button class="svc-tab active" id="inv-tab-materials" onclick="switchInvTab('materials')">📦 Materiales</button>
                <button class="svc-tab" id="inv-tab-movements" onclick="switchInvTab('movements')">🔄 Movimientos</button>
                <button class="svc-tab" id="inv-tab-cartera" onclick="switchInvTab('cartera')">💳 Cartera</button>
                <button class="svc-tab" id="inv-tab-special" onclick="switchInvTab('special')">⭐ Precios Especiales</button>
            </div>
            <div style="display:flex; gap:16px; margin-bottom:24px;">
                <div class="stat-card"><div class="stat-number" id="stat-total">0</div><div class="stat-label">Total Productos</div></div>
                <div class="stat-card"><div class="stat-number" id="stat-lowstock" style="color:#e53e3e;">0</div><div class="stat-label">Stock Bajo</div></div>
                <div class="stat-card"><div class="stat-number" id="stat-value">$0</div><div class="stat-label">Valor Total</div></div>
            </div>
<!-- TAB: Materials -->
            <div id="inv-tab-content-materials">
            <div style="display:flex; gap:12px; margin-bottom:16px;">
                <input type="text" id="search-input" placeholder="🔍 Search products..." oninput="filterInventory()" style="flex:1; padding:10px 14px; border:1px solid #ddd; border-radius:8px; font-size:14px; outline:none;">
                <select id="category-filter" onchange="filterInventory()" style="padding:10px 14px; border:1px solid #ddd; border-radius:8px; font-size:14px; outline:none; background:white;"><option value="">All Categorías</option></select>
                <select id="stock-filter" onchange="filterInventory()" style="padding:10px 14px; border:1px solid #ddd; border-radius:8px; font-size:14px; outline:none; background:white;"><option value="">All Stock</option><option value="low">⚠️ Stock Bajo Only</option><option value="ok">✅ En Stock Only</option></select>
            </div>
            <div style="background:white; border-radius:12px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,0.08);">
                <table id="inventory-table" style="width:100%; border-collapse:collapse;">
                    <thead>
                        <tr style="background:#f8f9fa; border-bottom:2px solid #eee;">
                            <th style="padding:14px 16px; text-align:left; font-size:13px; color:#444;">Nombre del Producto</th>
                            <th style="padding:14px 16px; text-align:left; font-size:13px; color:#444;">Categoría</th>
                            <th style="padding:14px 16px; text-align:center; font-size:13px; color:#444;">Cantidad</th>
                            <th style="padding:14px 16px; text-align:right; font-size:13px; color:#444;">Price</th>
                            <th style="padding:14px 16px; text-align:center; font-size:13px; color:#444;">Estado</th>
                            <th style="padding:14px 16px; text-align:center; font-size:13px; color:#444;">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="inventory-body"></tbody>
                </table>
                <div id="empty-state" style="display:none; padding:60px; text-align:center; color:#888;">
                    <p style="font-size:40px;">📦</p>
                    <p style="font-size:16px; margin-top:12px;">Aún no hay productos</p>
                    <p style="font-size:13px; margin-top:6px;">Haga clic en "+ Agregar Material" para comenzar</p>
               </div>
            </div>
            </div><!-- end materials tab -->

            <!-- TAB: Movements -->
            <div id="inv-tab-content-movements" style="display:none;">
                <div class="settings-card" style="margin-bottom:24px;">
                    <h2 class="settings-card-title">🔄 Nuevo Movimiento</h2>

                    <!-- Row 1: Material + Client -->
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;">
                        <div class="settings-field">
                            <label>Material *</label>
                            <select id="mov2-product" onchange="onMov2ProductChange()">
                                <option value="">— Seleccione material —</option>
                            </select>
                        </div>
                        <div class="settings-field">
                            <label>Client</label>
                            <select id="mov2-client" onchange="onMov2ClientChange()">
                                <option value="">— Seleccione cliente (opcional) —</option>
                            </select>
                        </div>
                    </div>

                    <!-- Special price alert -->
                    <div id="mov2-special-price-alert" style="display:none;background:#fffbeb;border:1px solid #fbd38d;border-radius:8px;padding:10px 14px;margin-bottom:16px;font-size:13px;color:#744210;font-weight:600;"></div>

                    <!-- Stock indicator -->
                    <div id="mov2-stock-indicator" style="display:none;background:#f0fff4;border:1px solid #c6f6d5;border-radius:8px;padding:10px 14px;margin-bottom:16px;font-size:13px;color:#276749;font-weight:600;"></div>

                    <!-- Row 2: Movement type + Payment type -->
                    <div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:16px;margin-bottom:16px;">
                        <div class="settings-field">
                            <label>Tipo de Movimiento *</label>
                            <select id="mov2-type">
                                <option value="external">Externo (Venta)</option>
                                <option value="internal">Interno (Uso Propio)</option>
                            </select>
                        </div>
                        <div class="settings-field">
                            <label>Tipo de Pago *</label>
                            <select id="mov2-payment" onchange="onMov2PaymentChange()">
                                <option value="contado">Contado</option>
                                <option value="credito">Crédito</option>
                            </select>
                        </div>
                        <div class="settings-field">
                           <label>Cantidad *</label>
                        <input type="number" id="mov2-quantity" min="0.01" step="0.01" placeholder="0" oninput="calcMov2Total()" />
                        </div>
                        <div class="settings-field">
                            <label>Fecha *</label>
                            <input type="date" id="mov2-date" />
                        </div>
                    </div>

                    <!-- Row 3: Price fields -->
                    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:16px;">
                        <div class="settings-field">
                            <label>Precio Unitario *</label>
                            <input type="number" id="mov2-unit-price" min="0" step="0.01" placeholder="0.00" oninput="calcMov2Total()" />
                        </div>
                        <div class="settings-field">
                            <label>Monto Total</label>
                            <input type="number" id="mov2-total" min="0" step="0.01" placeholder="0.00" readonly style="background:#f8f9fa;" />
                        </div>
                        <div class="settings-field" id="mov2-due-date-field" style="display:none;">
                            <label>Payment Due Fecha *</label>
                            <input type="date" id="mov2-due-date" />
                        </div>
                    </div>

                    <!-- Row 4: Notas -->
                    <div class="settings-field" style="margin-bottom:16px;">
                        <label>Notas</label>
                        <textarea id="mov2-notes" placeholder="Detalles adicionales..." style="width:100%;padding:10px 14px;border:1px solid #ddd;border-radius:8px;font-size:14px;outline:none;resize:vertical;min-height:70px;font-family:'Segoe UI',Arial,sans-serif;max-width:100%;"></textarea>
                    </div>

                    <div id="mov2-error" style="min-height:20px;font-size:13px;color:#e53e3e;margin-bottom:16px;"></div>
                    <button class="settings-btn-primary" onclick="saveMov2()">🔄 Registrar Movimiento</button>
                </div>

                <!-- Movement History -->
                <div class="report-card">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid #f0f0f0;">
                        <h2 style="font-size:15px;font-weight:700;color:#1a1a2e;">📋 Historial de Movimientos</h2>
                        <div style="display:flex;gap:10px;">
                            <input type="text" id="mov2-search" placeholder="🔍 Buscar..." oninput="filterMov2()" style="padding:8px 12px;border:1px solid #ddd;border-radius:8px;font-size:13px;outline:none;width:160px;">
                            <select id="mov2-filter-type" onchange="filterMov2()" style="padding:8px 12px;border:1px solid #ddd;border-radius:8px;font-size:13px;outline:none;background:white;">
                                <option value="">Todos los Tipos</option>
                                <option value="external">External</option>
                                <option value="internal">Internal</option>
                            </select>
                            <select id="mov2-filter-payment" onchange="filterMov2()" style="padding:8px 12px;border:1px solid #ddd;border-radius:8px;font-size:13px;outline:none;background:white;">
                                <option value="">Todos los Pagos</option>
                                <option value="contado">Contado</option>
                                <option value="credito">Crédito</option>
                            </select>
                        </div>
                    </div>
                    <table style="width:100%;border-collapse:collapse;" id="mov2-table">
                        <thead>
                            <tr style="background:#f8f9fa;border-bottom:2px solid #eee;">
                                <th style="padding:12px 16px;text-align:left;font-size:13px;color:#444;">Date</th>
                                <th style="padding:12px 16px;text-align:left;font-size:13px;color:#444;">Material</th>
                                <th style="padding:12px 16px;text-align:left;font-size:13px;color:#444;">Client</th>
                                <th style="padding:12px 16px;text-align:center;font-size:13px;color:#444;">Tipo</th>
                                <th style="padding:12px 16px;text-align:center;font-size:13px;color:#444;">Payment</th>
                                <th style="padding:12px 16px;text-align:center;font-size:13px;color:#444;">Qty</th>
                                <th style="padding:12px 16px;text-align:right;font-size:13px;color:#444;">Total</th>
                                <th style="padding:12px 16px;text-align:center;font-size:13px;color:#444;">Estado</th>
                                <th style="padding:12px 16px;text-align:center;font-size:13px;color:#444;">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="mov2-body"></tbody>
                    </table>
                    <div id="mov2-empty" style="display:none;padding:40px;text-align:center;color:#888;">
                        <p style="font-size:32px;">🔄</p>
                        <p style="font-size:15px;margin-top:12px;">Aún no hay movimientos</p>
                    </div>
                </div>
            </div><!-- end movements tab -->

            <!-- TAB: Cartera -->
            <div id="inv-tab-content-cartera" style="display:none;">
                <div class="report-card">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid #f0f0f0;">
                        <h2 style="font-size:15px;font-weight:700;color:#1a1a2e;">💳 Cartera por Cobrar</h2>
                        <div style="display:flex;gap:16px;">
                            <div style="text-align:center;">

    <script type="module">
    // ============================================
    // FIREBASE INTEGRATION — Cloud Save/Load
    // ============================================
    import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBevSvWNUBHCZRgRrthlTicy2_Dap_US84",
        authDomain: "carwash-crm-cdf50.firebaseapp.com",
        projectId: "carwash-crm-cdf50",
        storageBucket: "carwash-crm-cdf50.firebasestorage.app",
        messagingSenderId: "219035211353",
        appId: "1:219035211353:web:4d1a5c11e0a6fd11a1c348"
    };

    const fbApp = getApps().length === 0 ? initializeApp(firebaseConfig) : getApps()[0];
    const fbDb = getFirestore(fbApp);
    const fbAuth = getAuth(fbApp);

    // Override DB with Firebase version
    window.DB = {
        getPassword() { return "firebase"; },
        setPassword() {},
        clearPassword() {},
        async save(data) {
            try {
                sessionStorage.setItem("appData", JSON.stringify(data));
                const user = fbAuth.currentUser;
                if (!user) return false;
                await setDoc(doc(fbDb, "businesses", "carwash-001"), {
                    data: JSON.stringify(data),
                    updatedAt: new Date().toISOString()
                });
                return true;
            } catch(e) {
                console.error("Firebase save error:", e);
                return false;
            }
        }
    };

    // Override logout
    window.logout = async function() {
        try {
            const data = sessionStorage.getItem("appData");
            if (data) await window.DB.save(JSON.parse(data));
            await signOut(fbAuth);
        } catch(e) {}
        sessionStorage.clear();
        window.location.href = "index.html";
    };

    // Auto-restore session from Firebase if sessionStorage is empty
    onAuthStateChanged(fbAuth, async function(user) {
        if (!user) {
            if (!sessionStorage.getItem("currentUser")) {
                window.location.href = "index.html";
            }
            return;
        }
        // Firebase user exists but session might be empty (page refresh)
        if (!sessionStorage.getItem("appData")) {
            try {
                const snap = await getDoc(doc(fbDb, "businesses", "carwash-001"));
                if (snap.exists()) {
                    const data = JSON.parse(snap.data().data);
                    sessionStorage.setItem("appData", JSON.stringify(data));
                    sessionStorage.setItem("currentUser", JSON.stringify({
                        username: user.email.replace("@carwash-crm.app", ""),
                        role: "admin",
                        uid: user.uid
                    }));
                    // Hide restore overlay if showing
                    const overlay = document.getElementById("session-restore-overlay");
                    if (overlay) overlay.style.display = "none";
                    // Reload app
                    if (typeof buildSidebar === "function") buildSidebar();
                    if (typeof loadDefaultModule === "function") loadDefaultModule();
                    if (typeof loadSidebarBranding === "function") loadSidebarBranding();
                    if (typeof loadUserInfo === "function") loadUserInfo();
                }
            } catch(e) { console.error("Firebase restore error:", e); }
        }
    });
    </script>

            const logoContainer = document.getElementById("sidebar-logo-container");

    async function saveProduct(id) {
    const name = document.getElementById("form-name").value.trim();
    const category = document.getElementById("form-category").value.trim();
    const quantity = document.getElementById("form-quantity").value;
    const unit = document.getElementById("form-unit").value;
    const threshold = document.getElementById("form-threshold").value;
    const cost = document.getElementById("form-cost").value;
    const price = document.getElementById("form-price").value;
    const internalPrice = document.getElementById("form-internal-price").value;
    const specialPrice = document.getElementById("form-special-price").value;
    const errorEl = document.getElementById("form-error");

    if (!name) { errorEl.textContent = "⚠️ Material name is required."; return; }
    if (!category) { errorEl.textContent = "⚠️ Categoría is required."; return; }
    if (quantity === "" || isNaN(quantity) || parseInt(quantity) < 0) { errorEl.textContent = "⚠️ Por favor ingrese una cantidad válida."; return; }
    if (cost === "" || isNaN(cost) || parseFloat(cost) < 0) { errorEl.textContent = "⚠️ Por favor ingrese un precio de costo válido."; return; }
    if (price === "" || isNaN(price) || parseFloat(price) < 0) { errorEl.textContent = "⚠️ Por favor ingrese un precio de venta válido."; return; }

    const product = {
        id: id || generateId(),
        name, category,
        quantity: parseFloat(quantity),
        unit: unit || "piezas",
        threshold: threshold ? parseFloat(threshold) : null,
        cost: parseFloat(cost),
        price: parseFloat(price),
        internalPrice: internalPrice ? parseFloat(internalPrice) : null,
        specialPrice: specialPrice ? parseFloat(specialPrice) : null,
       containerTipo: document.getElementById("form-container-type")?.value || "",
        containerCustomName: document.getElementById("form-container-custom")?.value.trim() || "",
        capacity: document.getElementById("form-capacity")?.value ? parseFloat(document.getElementById("form-capacity").value) : null,
        batches: currentBatches || [],
        updatedAt: new Date().toISOString()
    };

    const data = getAppData();
    if (id) {
        const i = data.inventory.findIndex(i => i.id === id);
        if (i !== -1) data.inventory[i] = product;
    } else {
        product.createdAt = new Date().toISOString();
        data.inventory.push(product);
    }
    await saveAppData(data);
    closeProductForm();
    loadInventory();
}

    function renderInventory(items) {
        const body = document.getElementById("inventory-body");
        const emptyState = document.getElementById("empty-state");
        const table = document.getElementById("inventory-table");
        const threshold = getLowStockThreshold();
        if (!items || items.length === 0) { table.style.display = "none"; emptyState.style.display = "block"; return; }
        table.style.display = "table"; emptyState.style.display = "none"; body.innerHTML = "";
        items.forEach(item => {
            const isLow = item.quantity <= threshold;
            const row = document.createElement("tr");
            row.className = "inv-row";
            if (isLow) row.style.background = "#fff8f8";
           const batchCount = item.batches?.length || 0;
            const batchTotal = item.batches?.reduce((sum, b) => sum + b.total, 0) || 0;
            row.innerHTML = `
                <td style="font-weight:600;color:#1a1a2e;">
                    ${item.name}
                    ${batchCount > 0 ? `<div style="font-size:11px;color:#4f46e5;font-weight:400;margin-top:2px;">📦 ${batchCount} batch${batchCount > 1 ? 'es' : ''} · ${batchTotal.toFixed(2)} total</div>` : ""}
                </td>
                <td style="color:#666;">${item.category || "—"}</td>
                <td style="text-align:center;font-weight:600;color:${isLow ? '#e53e3e' : '#1a1a2e'};">
                    ${item.quantity} <span style="font-size:11px;color:#aaa;font-weight:400;">${item.unit || ''}</span>
                </td>
                <td style="text-align:right;">${formatMoneda(item.price)}</td>
                <td style="text-align:center;"><span class="${isLow ? 'badge-low' : 'badge-ok'}">${isLow ? '⚠️ Stock Bajo' : '✅ En Stock'}</span></td>
                <td style="text-align:center;">
                    <button class="action-btn btn-edit" onclick="showEditForm('${item.id}')">✏️ Editar</button>
                    <button class="action-btn btn-delete" onclick="deleteProduct('${item.id}')">🗑️ Eliminar</button>
                </td>`;
            body.appendChild(row);
        });
    }

    function updateStats(items) {
        const threshold = getLowStockThreshold();
        document.getElementById("stat-total").textContent = items.length;
        document.getElementById("stat-lowstock").textContent = items.filter(i => i.quantity <= threshold).length;
        document.getElementById("stat-value").textContent = formatMoneda(items.reduce((s, i) => s + (i.price * i.quantity), 0));
    }

    function populateCategorías(items) {
        const select = document.getElementById("category-filter");
        const categories = [...new Set(items.map(i => i.category).filter(Boolean))];
        const current = select.value;
        select.innerHTML = `<option value="">All Categorías</option>`;
        categories.forEach(cat => { const opt = document.createElement("option"); opt.value = cat; opt.textContent = cat; if (cat === current) opt.selected = true; select.appendChild(opt); });
    }

    function filterInventory() {
        const data = getAppData();
        const search = document.getElementById("search-input").value.toLowerCase();
        const category = document.getElementById("category-filter").value;
        const stockFilter = document.getElementById("stock-filter").value;
        const threshold = getLowStockThreshold();
        let items = data.inventory || [];
        if (search) items = items.filter(i => i.name.toLowerCase().includes(search) || (i.category && i.category.toLowerCase().includes(search)));
        if (category) items = items.filter(i => i.category === category);
        if (stockFilter === "low") items = items.filter(i => i.quantity <= threshold);
        else if (stockFilter === "ok") items = items.filter(i => i.quantity > threshold);
        renderInventory(items);
    }

    async function deleteProduct(id) {
        if (!confirm("¿Está seguro de que desea eliminar este producto??")) return;
        const data = getAppData();
        data.inventory = data.inventory.filter(i => i.id !== id);
        await saveAppData(data);
        loadInventory();
    }

    function renderLowStockBanner(items) {
        const threshold = getLowStockThreshold();
        const lowItems = items.filter(i => i.quantity <= threshold);
        const existing = document.getElementById("low-stock-banner");
        if (existing) existing.remove();
        if (lowItems.length === 0) return;
        const banner = document.createElement("div");
        banner.id = "low-stock-banner";
        banner.className = "low-stock-banner";
        const itemNames = lowItems.slice(0, 3).map(i => i.name).join(", ");
        const extra = lowItems.length > 3 ? ` and ${lowItems.length - 3} more` : "";
        banner.innerHTML = `<div class="banner-icon">🚨</div><div class="banner-text"><strong>${lowItems.length} item${lowItems.length > 1 ? 's' : ''} running low!</strong><span>${itemNames}${extra}</span></div><span class="banner-link" onclick="filterLowStock()">Ver Todo →</span>`;
        const module = document.getElementById("inventory-module");
        if (module) module.insertBefore(banner, module.firstChild);
    }

    function filterLowStock() { const s = document.getElementById("stock-filter"); if (s) { s.value = "low"; filterInventory(); } }
function printInventoryReport() {
        window.open("print-inventory.html", "_blank");
    }
    function loadInventory() {
        const data = getAppData();
        const items = data.inventory || [];
        populateCategorías(items);
        updateStats(items);
        renderInventory(items);
        renderLowStockBanner(items);
        if (typeof updateSidebarBadges === "function") updateSidebarBadges();
    }

    <script>
    // ============================================
    // STOCK MOVEMENT MODULE
    // ============================================
    function getMovData() { return JSON.parse(sessionStorage.getItem("appData")); }
    async function saveMovData(data) { sessionStorage.setItem("appData", JSON.stringify(data)); await DB.save(data); }
    function generateMovId() { return "mov_" + Date.now() + "_" + Math.random().toString(36).substr(2, 9); }
    function formatMovDate(dateStr) { if (!dateStr) return "—"; const d = new Date(dateStr + "T00:00:00"); return d.toLocaleDateString("en-US", { year:"numeric", month:"short", day:"numeric" }); }

    function loadMovements() {
        const data = getMovData();
        const today = new Date().toISOString().split("T")[0];
        const dateEl = document.getElementById("mov-date");
        if (dateEl) dateEl.value = today;
        populateMovProductDropdown(data.inventory || []);
        populateMovFilterDropdown(data.movements || []);
        renderMovements(data.movements || []);
    }

    function populateMovProductDropdown(items) {
        const select = document.getElementById("mov-product");
        if (!select) return;
        select.innerHTML = `<option value="">— Select a product —</option>`;
        items.forEach(item => { const opt = document.createElement("option"); opt.value = item.id; opt.textContent = `${item.name} (${item.quantity} in stock)`; select.appendChild(opt); });
    }

    function populateMovFilterDropdown(movements) {
        const select = document.getElementById("mov-filter-product");
        if (!select) return;
        const products = [...new Set(movements.map(m => m.productName))];
        select.innerHTML = `<option value="">All Products</option>`;
        products.forEach(name => { const opt = document.createElement("option"); opt.value = name; opt.textContent = name; select.appendChild(opt); });
    }

    function updateAvailableStock() {
        const select = document.getElementById("mov-product");
        const availableEl = document.getElementById("mov-available");
        const productId = select.value;
        if (!productId) { availableEl.style.display = "none"; return; }
        const data = getMovData();
        const item = data.inventory.find(i => i.id === productId);
        if (!item) return;
        availableEl.style.display = "block";
        if (item.quantity <= 0) { availableEl.style.background = "#fff5f5"; availableEl.style.borderColor = "#fed7d7"; availableEl.style.color = "#c53030"; availableEl.textContent = `⚠️ ${item.name} is out of stock!`; }
        else if (item.quantity <= (AppConfig.lowStockThreshold || 5)) { availableEl.style.background = "#fffbeb"; availableEl.style.borderColor = "#fbd38d"; availableEl.style.color = "#c05621"; availableEl.textContent = `⚠️ Low stock! Only ${item.quantity} unidades disponibles.`; }
        else { availableEl.style.background = "#f0fff4"; availableEl.style.borderColor = "#c6f6d5"; availableEl.style.color = "#276749"; availableEl.textContent = `✅ ${item.quantity} unidades disponibles.`; }
    }

    async function saveMovement() {
        const productId = document.getElementById("mov-product").value;
        const person = document.getElementById("mov-person").value.trim();
        const quantity = parseInt(document.getElementById("mov-quantity").value);
        const date = document.getElementById("mov-date").value;
        const notes = document.getElementById("mov-notes").value.trim();
        const errorEl = document.getElementById("mov-error");
        errorEl.textContent = "";
        if (!productId) { errorEl.textContent = "⚠️ Por favor seleccione un producto."; return; }
        if (!person) { errorEl.textContent = "⚠️ Por favor ingrese el nombre de la persona."; return; }
        if (!quantity || quantity < 1) { errorEl.textContent = "⚠️ Por favor ingrese una cantidad válida."; return; }
        if (!date) { errorEl.textContent = "⚠️ Por favor seleccione una fecha."; return; }
        const data = getMovData();
        const itemIndex = data.inventory.findIndex(i => i.id === productId);
        if (itemIndex === -1) { errorEl.textContent = "⚠️ Producto no encontrado."; return; }
        const item = data.inventory[itemIndex];
        if (quantity > item.quantity) { errorEl.textContent = `⚠️ ¡Stock insuficiente! Only ${item.quantity} unidades disponibles.`; return; }
        const stockBefore = item.quantity;
        data.inventory[itemIndex].quantity -= quantity;
        const stockAfter = data.inventory[itemIndex].quantity;
        if (!data.movements) data.movements = [];
        data.movements.unshift({ id: generateMovId(), productId: item.id, productName: item.name, category: item.category, person, quantity, stockBefore, stockAfter, date, notes, createdAt: new Date().toISOString() });
        await saveMovData(data);
        document.getElementById("mov-product").value = "";
        document.getElementById("mov-person").value = "";
        document.getElementById("mov-quantity").value = "";
        document.getElementById("mov-notes").value = "";
        document.getElementById("mov-date").value = new Date().toISOString().split("T")[0];
        document.getElementById("mov-available").style.display = "none";
        errorEl.style.color = "#38a169";
        errorEl.textContent = `✅ ¡Movimiento registrado! ${item.name} stock reducido de ${stockBefore} to ${stockAfter}.`;
        setTimeout(() => { errorEl.textContent = ""; errorEl.style.color = "#e53e3e"; }, 4000);
        loadMovements();
        if (typeof updateSidebarBadges === "function") updateSidebarBadges();
    }

    async function deleteMovement(id) {
        if (!confirm("¿Eliminar este registro de movimiento??")) return;
        const data = getMovData();
        data.movements = (data.movements || []).filter(m => m.id !== id);
        await saveMovData(data);
        loadMovements();
    }

    function filterMovements() {
        const data = getMovData();
        const search = document.getElementById("mov-search").value.toLowerCase();
        const productFilter = document.getElementById("mov-filter-product").value;
        let movements = data.movements || [];
        if (search) movements = movements.filter(m => m.productName.toLowerCase().includes(search) || m.person.toLowerCase().includes(search) || (m.notes && m.notes.toLowerCase().includes(search)));
        if (productFilter) movements = movements.filter(m => m.productName === productFilter);
        renderMovements(movements);
    }

    function renderMovements(movements) {
        const body = document.getElementById("mov-body");
        const emptyEl = document.getElementById("mov-empty");
        const table = document.getElementById("mov-table");
        if (!movements || movements.length === 0) { table.style.display = "none"; emptyEl.style.display = "block"; return; }
        table.style.display = "table"; emptyEl.style.display = "none"; body.innerHTML = "";
        movements.forEach(mov => {
            const isLow = mov.stockAfter <= (AppConfig.lowStockThreshold || 5);
            const row = document.createElement("tr");
            row.style.borderBottom = "1px solid #f0f0f0";
            row.innerHTML = `
                <td style="padding:12px 16px;font-size:13px;color:#666;white-space:nowrap;">${formatMovDate(mov.date)}</td>
                <td style="padding:12px 16px;font-size:14px;font-weight:600;color:#1a1a2e;">${mov.productName}<div style="font-size:11px;color:#aaa;font-weight:400;">${mov.category || ""}</div></td>
                <td style="padding:12px 16px;font-size:14px;color:#444;">${mov.person}</td>
                <td style="padding:12px 16px;text-align:center;font-size:15px;font-weight:700;color:#e53e3e;">-${mov.quantity}</td>
                <td style="padding:12px 16px;text-align:center;"><span class="${isLow ? 'badge-low' : 'badge-ok'}">${mov.stockAfter} ${isLow ? '⚠️' : '✅'}</span></td>
                <td style="padding:12px 16px;font-size:13px;color:#666;max-width:200px;">${mov.notes || '<span style="color:#ccc;">—</span>'}</td>
                <td style="padding:12px 16px;text-align:center;"><button class="action-btn btn-delete" onclick="deleteMovement('${mov.id}')">🗑️ Eliminar</button></td>`;
            body.appendChild(row);
        });
    }
    </script>

        const errorEl = document.getElementById("svc-catalog-error");
        errorEl.textContent = "";
        if (!name) { errorEl.style.color = "#e53e3e"; errorEl.textContent = "⚠️ El nombre del servicio es requerido."; return; }
        if (cost === "" || isNaN(cost) || parseFloat(cost) < 0) { errorEl.style.color = "#e53e3e"; errorEl.textContent = "⚠️ Por favor ingrese un precio de costo válido."; return; }
        if (price === "" || isNaN(price) || parseFloat(price) < 0) { errorEl.style.color = "#e53e3e"; errorEl.textContent = "⚠️ Por favor ingrese un precio de venta válido."; return; }
        const data = getSvcData();
        if (!data.services) data.services = [];
        const exists = data.services.find(s => s.name.toLowerCase() === name.toLowerCase());
        if (exists) { errorEl.style.color = "#e53e3e"; errorEl.textContent = "⚠️ Ya existe un servicio con este nombre."; return; }
        const comision = parseFloat(document.getElementById("svc-comision")?.value || 0) || 0;
        data.services.push({ id: generateSvcId(), name, cost: parseFloat(cost), price: parseFloat(price), comision, description, createdAt: new Date().toISOString() });
        await saveSvcData(data);
        document.getElementById("svc-name").value = "";
        document.getElementById("svc-cost").value = "";
        document.getElementById("svc-price").value = "";
        if (document.getElementById("svc-comision")) document.getElementById("svc-comision").value = "";
        document.getElementById("svc-description").value = "";
        errorEl.style.color = "#38a169";
        errorEl.textContent = "✅ Servicio \"" + name + "\" agregado!";
        setTimeout(() => errorEl.textContent = "", 3000);
        updateSvcStats(data);
        renderServiceCatalog(data.services);
    }

    async function deleteService(id) {
        if (!confirm("¿Eliminar este servicio??")) return;
        const data = getSvcData();
        data.services = data.services.filter(s => s.id !== id);
        await saveSvcData(data);
        updateSvcStats(data);
        renderServiceCatalog(data.services);
    }

    function renderServiceCatalog(servicios) {
        const body = document.getElementById("svc-catalog-body");
        const emptyEl = document.getElementById("svc-catalog-empty");
        const table = document.getElementById("svc-catalog-table");
        if (!servicios || servicios.length === 0) { table.style.display = "none"; emptyEl.style.display = "block"; return; }
        table.style.display = "table"; emptyEl.style.display = "none"; body.innerHTML = "";
        servicios.forEach(svc => {
            const margin = svc.price - svc.cost;
            const marginPct = svc.cost > 0 ? ((margin / svc.cost) * 100).toFixed(0) : 0;
            const comision = svc.comision || 0;
            const row = document.createElement("tr");
            row.style.borderBottom = "1px solid #f0f0f0";
            row.id = "svc-row-" + svc.id;
            row.innerHTML = `
                <td style="padding:12px 16px;font-weight:600;color:#1a1a2e;font-size:14px;">${svc.name}</td>
                <td style="padding:12px 16px;color:#888;font-size:13px;">${svc.description || "—"}</td>
                <td style="padding:12px 16px;text-align:right;color:#666;font-size:14px;">${fmtSvc(svc.cost)}</td>
                <td style="padding:12px 16px;text-align:right;font-weight:600;color:#1a1a2e;font-size:14px;">${fmtSvc(svc.price)}</td>
                <td style="padding:12px 16px;text-align:right;">
                    <span style="background:${margin >= 0 ? '#f0fff4' : '#fff5f5'};color:${margin >= 0 ? '#38a169' : '#e53e3e'};padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600;">
                        ${margin >= 0 ? '+' : ''}${fmtSvc(margin)} (${marginPct}%)
                    </span>
                </td>
                <td style="padding:12px 16px;text-align:right;font-weight:700;color:#38a169;font-size:14px;">
                    ${comision > 0 ? fmtSvc(comision) : '<span style="color:#ccc;">—</span>'}
                </td>
                <td style="padding:12px 16px;text-align:center;white-space:nowrap;">
                    <button class="action-btn btn-edit" onclick="editService('${svc.id}')">✏️ Editar</button>
                    <button class="action-btn btn-delete" onclick="deleteService('${svc.id}')">🗑️ Eliminar</button>
                </td>`;
            body.appendChild(row);
        });
    }

    function editService(id) {
        const data = getSvcData();
        const svc = (data.services || []).find(s => s.id === id);
        if (!svc) return;

        const row = document.getElementById("svc-row-" + id);
        if (!row) return;

        row.innerHTML = `
            <td style="padding:8px 12px;">
                <input type="text" id="edit-name-${id}" value="${svc.name}"
                    style="width:100%;padding:6px 10px;border:1px solid #4f46e5;border-radius:6px;font-size:13px;outline:none;" />
            </td>
            <td style="padding:8px 12px;">
                <input type="text" id="edit-desc-${id}" value="${svc.description || ''}"
                    style="width:100%;padding:6px 10px;border:1px solid #ddd;border-radius:6px;font-size:13px;outline:none;" />
            </td>
            <td style="padding:8px 12px;">
                <input type="number" id="edit-cost-${id}" value="${svc.cost}"
                    style="width:90px;padding:6px 10px;border:1px solid #ddd;border-radius:6px;font-size:13px;outline:none;text-align:right;" />
            </td>
            <td style="padding:8px 12px;">
                <input type="number" id="edit-price-${id}" value="${svc.price}"
                    style="width:90px;padding:6px 10px;border:1px solid #ddd;border-radius:6px;font-size:13px;outline:none;text-align:right;" />
            </td>
            <td style="padding:8px 12px;text-align:center;color:#aaa;font-size:12px;">auto</td>
            <td style="padding:8px 12px;">
                <input type="number" id="edit-comision-${id}" value="${svc.comision || 0}"
                    style="width:90px;padding:6px 10px;border:1px solid #ddd;border-radius:6px;font-size:13px;outline:none;text-align:right;" />
            </td>
            <td style="padding:8px 12px;text-align:center;white-space:nowrap;">
                <button class="action-btn btn-edit" onclick="saveServiceEdit('${id}')">💾 Guardar</button>
                <button class="action-btn btn-delete" style="background:#f5f6fa;color:#444;border:1px solid #ddd;" onclick="cancelServiceEdit()">✕</button>
            </td>`;
    }

    async function saveServiceEdit(id) {
        const data = getSvcData();
        const idx = (data.services || []).findIndex(s => s.id === id);
        if (idx === -1) return;

        const name = document.getElementById("edit-name-" + id)?.value.trim();
        const desc = document.getElementById("edit-desc-" + id)?.value.trim();
        const cost = parseFloat(document.getElementById("edit-cost-" + id)?.value || 0);
        const price = parseFloat(document.getElementById("edit-price-" + id)?.value || 0);
        const comision = parseFloat(document.getElementById("edit-comision-" + id)?.value || 0);

        if (!name) { alert("⚠️ El nombre es requerido."); return; }
        if (isNaN(cost) || cost < 0) { alert("⚠️ Precio de costo inválido."); return; }
        if (isNaN(price) || price < 0) { alert("⚠️ Precio de venta inválido."); return; }

        data.services[idx] = { ...data.services[idx], name, description: desc, cost, price, comision, updatedAt: new Date().toISOString() };
        await saveSvcData(data);
        renderServiceCatalog(data.services);
    }

    function cancelServiceEdit() {
        const data = getSvcData();
        renderServiceCatalog(data.services);
    }

    function populateSaleServiceDropdown() {
        const data = getSvcData();
        const select = document.getElementById("sale-service");
        if (!select) return;
        select.innerHTML = `<option value="">— Seleccione un servicio —</option>`;
        (data.services || []).forEach(svc => { const opt = document.createElement("option"); opt.value = svc.id; opt.textContent = `${svc.name} — ${fmtSvc(svc.price)}`; select.appendChild(opt); });
    }

    function updateSalePrice() {
        const data = getSvcData();
        const serviceId = document.getElementById("sale-service").value;
        const indicator = document.getElementById("sale-price-indicator");
        const amountEl = document.getElementById("sale-amount");
        if (!serviceId) { indicator.style.display = "none"; return; }
        const svc = data.services.find(s => s.id === serviceId);
        if (!svc) return;
        indicator.style.display = "block";
        indicator.innerHTML = `💰 Standard price: <strong>${fmtSvc(svc.price)}</strong> &nbsp;|&nbsp; Cost: <strong>${fmtSvc(svc.cost)}</strong> &nbsp;|&nbsp; Margen: <strong>${fmtSvc(svc.price - svc.cost)}</strong>`;
        amountEl.value = svc.price;
    }

    async function recordSale() {
        const serviceId = document.getElementById("sale-service").value;
        const date = document.getElementById("sale-date").value;
        const amount = document.getElementById("sale-amount").value;
        const soldBy = document.getElementById("sale-soldby").value.trim();
        const addons = document.getElementById("sale-addons").value.trim();
        const notes = document.getElementById("sale-notes").value.trim();
        const errorEl = document.getElementById("sale-error");
        errorEl.textContent = "";
        if (!serviceId) { errorEl.style.color = "#e53e3e"; errorEl.textContent = "⚠️ Por favor seleccione un servicio."; return; }
        if (!date) { errorEl.style.color = "#e53e3e"; errorEl.textContent = "⚠️ Por favor seleccione una fecha."; return; }
        if (!amount || isNaN(amount) || parseFloat(amount) < 0) { errorEl.style.color = "#e53e3e"; errorEl.textContent = "⚠️ Por favor ingrese un monto válido."; return; }
        if (!soldBy) { errorEl.style.color = "#e53e3e"; errorEl.textContent = "⚠️ Por favor seleccione el empleado que realizó el servicio."; return; }
        const data = getSvcData();
        const svc = data.services.find(s => s.id === serviceId);
        if (!svc) { errorEl.style.color = "#e53e3e"; errorEl.textContent = "⚠️ Service not found."; return; }
        if (!data.serviceSales) data.serviceSales = [];
        data.serviceSales.unshift({ id: generateSaleId(), serviceId: svc.id, serviceName: svc.name, date, amount: parseFloat(amount), costPrice: svc.cost, margin: parseFloat(amount) - svc.cost, soldBy, addons, notes, createdAt: new Date().toISOString() });
        await saveSvcData(data);
        document.getElementById("sale-service").value = "";
        document.getElementById("sale-amount").value = "";
        document.getElementById("sale-soldby").value = "";
        document.getElementById("sale-addons").value = "";
        document.getElementById("sale-notes").value = "";
        document.getElementById("sale-date").value = new Date().toISOString().split("T")[0];
        document.getElementById("sale-price-indicator").style.display = "none";
        errorEl.style.color = "#38a169";
        errorEl.textContent = `✅ ¡Venta registrada! Monto: ${fmtSvc(parseFloat(amount))}`;
        setTimeout(() => errorEl.textContent = "", 4000);
        updateSvcStats(data);
    }

    async function deleteSale(id) {
        if (!confirm("¿Eliminar este registro de venta??")) return;
        const data = getSvcData();
        data.serviceSales = data.serviceSales.filter(s => s.id !== id);
        await saveSvcData(data);
        updateSvcStats(data);
        filterSales();
    }

    function filterSales() {
        const data = getSvcData();
        const search = document.getElementById("sale-search")?.value.toLowerCase() || "";
        const serviceFilter = document.getElementById("sale-filter-service")?.value || "";
        const soldbyFilter = document.getElementById("sale-filter-soldby")?.value || "";
        const fromDate = document.getElementById("sale-filter-from")?.value || "";
        const toDate = document.getElementById("sale-filter-to")?.value || "";
        let sales = data.serviceSales || [];
        if (search) sales = sales.filter(s => s.serviceName.toLowerCase().includes(search) || s.soldBy.toLowerCase().includes(search) || (s.addons && s.addons.toLowerCase().includes(search)) || (s.notes && s.notes.toLowerCase().includes(search)));
        if (serviceFilter) sales = sales.filter(s => s.serviceName === serviceFilter);
        if (soldbyFilter) sales = sales.filter(s => s.soldBy === soldbyFilter);
        if (fromDate) sales = sales.filter(s => s.date >= fromDate);
        if (toDate) sales = sales.filter(s => s.date <= toDate);
        renderSalesHistory(sales);
    }

    function populateHistoryFilters(sales) {
        const servicios = [...new Set(sales.map(s => s.serviceName))];
        const soldby = [...new Set(sales.map(s => s.soldBy))];
        const svcFilter = document.getElementById("sale-filter-service");
        if (svcFilter) { svcFilter.innerHTML = `<option value="">Todos los Servicios</option>`; servicios.forEach(s => { const opt = document.createElement("option"); opt.value = s; opt.textContent = s; svcFilter.appendChild(opt); }); }
        const soldbyFilter = document.getElementById("sale-filter-soldby");
        if (soldbyFilter) { soldbyFilter.innerHTML = `<option value="">Todos los Empleados</option>`; soldby.forEach(s => { const opt = document.createElement("option"); opt.value = s; opt.textContent = s; soldbyFilter.appendChild(opt); }); }
    }

    function renderSalesHistory(sales) {
        const body = document.getElementById("sale-history-body");
        const emptyEl = document.getElementById("sale-history-empty");
        const table = document.getElementById("sale-history-table");
        populateHistoryFilters(getSvcData().serviceSales || []);
        if (!sales || sales.length === 0) { table.style.display = "none"; emptyEl.style.display = "block"; return; }
        table.style.display = "table"; emptyEl.style.display = "none"; body.innerHTML = "";
        sales.forEach(sale => {
            const row = document.createElement("tr");
            row.style.borderBottom = "1px solid #f0f0f0";
            const svcDef = (getSvcData().services||[]).find(s=>s.id===sale.serviceId);
            const comisionVenta = svcDef?.comision || 0;
            row.innerHTML = `
                <td style="padding:12px 16px;font-size:13px;color:#666;white-space:nowrap;">${formatSvcDate(sale.date)}</td>
                <td style="padding:12px 16px;font-size:14px;font-weight:600;color:#1a1a2e;">${sale.serviceName}</td>
                <td style="padding:12px 16px;font-size:14px;color:#444;">${sale.soldBy}</td>
                <td style="padding:12px 16px;text-align:right;font-weight:700;color:#38a169;font-size:15px;">${fmtSvc(sale.amount)}</td>
                <td style="padding:12px 16px;text-align:right;font-weight:600;color:#4f46e5;font-size:13px;">${comisionVenta > 0 ? fmtSvc(comisionVenta) : '<span style="color:#ccc;">—</span>'}</td>
                <td style="padding:12px 16px;font-size:13px;color:#666;">${sale.addons || '<span style="color:#ccc;">—</span>'}</td>
                <td style="padding:12px 16px;font-size:13px;color:#666;max-width:180px;">${sale.notes || '<span style="color:#ccc;">—</span>'}</td>
                <td style="padding:12px 16px;text-align:center;"><button class="action-btn btn-delete" onclick="deleteSale('${sale.id}')">🗑️ Eliminar</button></td>`;
            body.appendChild(row);
        });
    }
    </script>

    <script>
    // ============================================
    // RECEIPTS MODULE
    // ============================================
    function getRctData() { return JSON.parse(sessionStorage.getItem("appData")); }
    async function saveRctData(data) { sessionStorage.setItem("appData", JSON.stringify(data)); await DB.save(data); }
    function formatRctDate(dateStr) { if (!dateStr) return "—"; const d = new Date(dateStr + "T00:00:00"); return d.toLocaleDateString("en-US", { year:"numeric", month:"long", day:"numeric" }); }
    function fmtRct(amount) { const data = getRctData(); const currency = data.settings?.currency || AppConfig.currency || "MXN"; return `$${parseFloat(amount).toFixed(2)} ${currency}`; }

function handleLogoUpload(event) {
        const file = event.target.files[0];
        if (!file) return;

        if (file.size > 2 * 1024 * 1024) {
            alert("⚠️ La imagen es demasiado grande. Use una imagen menor a 2MB.");
            return;
        }

        const reader = new FileReader();
        reader.onload = async function(e) {
            const base64 = e.target.result;

            // Show preview immediately
            const preview = document.getElementById("rct-logo-preview");
            preview.innerHTML = `<img src="${base64}" style="width:100%; height:100%; object-fit:contain;" />`;
            document.getElementById("rct-remove-logo").style.display = "inline-block";

            // Get current app data directly from sessionStorage
            let rawData = sessionStorage.getItem("appData");
            let data = JSON.parse(rawData);

            // Marca sure companyInfo exists
            if (!data.companyInfo) {
                data.companyInfo = {
                    name: document.getElementById("rct-company-name").value.trim(),
                    address: document.getElementById("rct-company-address").value.trim(),
                    phone: document.getElementById("rct-company-phone").value.trim(),
                    email: document.getElementById("rct-company-email").value.trim(),
                    footer: document.getElementById("rct-footer-msg").value.trim()
                };
            }

            // Set logo
            data.companyInfo.logo = base64;

            // Save directly to sessionStorage
            sessionStorage.setItem("appData", JSON.stringify(data));

            // Encrypt and save to localStorage
            const pwd = DB.getPassword();
            if (pwd) {
                const encrypted = await Crypto.encrypt(data, pwd);
                localStorage.setItem("inventory-app-v1", encrypted);
            }

            // Verify
            const verify = JSON.parse(sessionStorage.getItem("appData"));
            console.log("✅ Logo saved:", !!verify.companyInfo?.logo);
            console.log("✅ Logo length:", verify.companyInfo?.logo?.length);

            // Refresh receipt preview
            previewReceipt();
            // Refresh sidebar branding
            if (typeof loadSidebarBranding === 'function') loadSidebarBranding();
        };
        reader.readAsDataURL(file);
    }

    function removeLogo() {
        if (!confirm("¿Eliminar el logo??")) return;
        const data = getRctData();
        if (data.companyInfo) delete data.companyInfo.logo;
        saveRctData(data);

        // Reset preview
        document.getElementById("rct-logo-preview").innerHTML = "🏢";
        document.getElementById("rct-remove-logo").style.display = "none";
        document.getElementById("rct-logo-input").value = "";

        // Refresh receipt preview
        previewReceipt();
    }
    function loadReceipts() {
        const data = getRctData();
        const info = data.companyInfo || {};
        document.getElementById("rct-company-name").value = info.name || "";
        document.getElementById("rct-company-address").value = info.address || "";
        document.getElementById("rct-company-phone").value = info.phone || "";
        document.getElementById("rct-company-email").value = info.email || "";
        document.getElementById("rct-footer-msg").value = info.footer || "¡Gracias por su preferencia!";
// Load logo if saved
        const logoPreview = document.getElementById("rct-logo-preview");
        const removeBtn = document.getElementById("rct-remove-logo");
        if (data.companyInfo?.logo) {
            logoPreview.innerHTML = `<img src="${data.companyInfo.logo}" style="width:100%; height:100%; object-fit:contain;" />`;
            removeBtn.style.display = "inline-block";
        } else {
            logoPreview.innerHTML = "🏢";
            removeBtn.style.display = "none";
        }
        populateSalesDropdown(data);
    }

    function populateSalesDropdown(data) {
        const sales = data.serviceSales || [];
        const select = document.getElementById("rct-sale-select");
        select.innerHTML = `<option value="">— Seleccione una venta —</option>`;
        if (sales.length === 0) { const opt = document.createElement("option"); opt.disabled = true; opt.textContent = "Aún no hay ventas registradas"; select.appendChild(opt); return; }
        sales.forEach((sale, index) => { const opt = document.createElement("option"); opt.value = index; opt.textContent = `${formatRctDate(sale.date)} — ${sale.serviceName} — ${fmtRct(sale.amount)} — ${sale.soldBy}`; select.appendChild(opt); });
    }

    async function saveCompanyInfo() {
        const data = getRctData();
        const msgEl = document.getElementById("rct-company-msg");
        data.companyInfo = {
            name: document.getElementById("rct-company-name").value.trim(),
            address: document.getElementById("rct-company-address").value.trim(),
            phone: document.getElementById("rct-company-phone").value.trim(),
            email: document.getElementById("rct-company-email").value.trim(),
            footer: document.getElementById("rct-footer-msg").value.trim()
        };
        await saveRctData(data);
        msgEl.style.color = "#38a169";
        msgEl.textContent = "✅ ¡Información guardada!";
        setTimeout(() => msgEl.textContent = "", 3000);
        previewReceipt();
    }

    function generateReceiptNumber(index) { return `RCT-${String(index + 1).padStart(4, "0")}`; }

function previewReceipt() {
        // Always get fresh data from session
        const data = JSON.parse(sessionStorage.getItem("appData"));
        const select = document.getElementById("rct-sale-select");
        const preview = document.getElementById("rct-preview");
        const printBtn = document.getElementById("rct-print-btn");
        const index = select.value;

        if (index === "") {
            preview.innerHTML = `<div style="text-align:center;color:#bbb;"><p style="font-size:32px;">🧾</p><p style="margin-top:12px;">Seleccione una venta para ver el recibo</p></div>`;
            printBtn.style.display = "none";
            return;
        }

        const sale = (data.serviceSales || [])[parseInt(index)];
        if (!sale) return;

        // Build info from both saved data AND current form fields
        const info = {
            name: document.getElementById("rct-company-name").value.trim() || data.companyInfo?.name || "",
            address: document.getElementById("rct-company-address").value.trim() || data.companyInfo?.address || "",
            phone: document.getElementById("rct-company-phone").value.trim() || data.companyInfo?.phone || "",
            email: document.getElementById("rct-company-email").value.trim() || data.companyInfo?.email || "",
            footer: document.getElementById("rct-footer-msg").value.trim() || data.companyInfo?.footer || "",
            logo: data.companyInfo?.logo || null
        };

        const receiptNumber = generateReceiptNumber(parseInt(index));
        preview.innerHTML = buildReceiptHtml(sale, info, receiptNumber);
        printBtn.style.display = "inline-block";
    }

    function buildReceiptHtml(sale, info, receiptNumber) {
        const currency = getRctData().settings?.currency || AppConfig.currency || "MXN";
        return `
        <div id="receipt-content" style="background:white;border:1px solid #eee;border-radius:8px;padding:32px;max-width:420px;margin:0 auto;font-family:'Segoe UI',Arial,sans-serif;">
            <div style="text-align:center;margin-bottom:24px;padding-bottom:20px;border-bottom:2px solid #1a1a2e;">
                ${info.logo
                    ? `<img src="${info.logo}" style="width:80px;height:80px;object-fit:contain;margin:0 auto 12px;display:block;border-radius:8px;" />`
                    : `<div style="width:60px;height:60px;background:#f0f0f0;border-radius:50%;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:24px;">🏢</div>`
                }
                <h2 style="font-size:18px;font-weight:800;color:#1a1a2e;margin:0;">${info.name || "Nombre de su Negocio"}</h2>
                ${info.address ? `<p style="font-size:12px;color:#888;margin:4px 0 0;">${info.address}</p>` : ""}
                ${info.phone ? `<p style="font-size:12px;color:#888;margin:2px 0 0;">📞 ${info.phone}</p>` : ""}
                ${info.email ? `<p style="font-size:12px;color:#888;margin:2px 0 0;">✉️ ${info.email}</p>` : ""}
            </div>
            <div style="display:flex;justify-content:space-between;margin-bottom:20px;">
                <div><div style="font-size:11px;color:#aaa;text-transform:uppercase;letter-spacing:1px;">Receipt No.</div><div style="font-size:14px;font-weight:700;color:#1a1a2e;">${receiptNumber}</div></div>
                <div style="text-align:right;"><div style="font-size:11px;color:#aaa;text-transform:uppercase;letter-spacing:1px;">Date</div><div style="font-size:14px;font-weight:700;color:#1a1a2e;">${formatRctDate(sale.date)}</div></div>
            </div>
            <div style="border-top:1px dashed #ddd;margin-bottom:20px;"></div>
            <div style="margin-bottom:20px;">
                <div style="font-size:11px;color:#aaa;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;">Service Details</div>
                <div style="display:flex;justify-content:space-between;margin-bottom:10px;"><span style="font-size:13px;color:#666;">Service</span><span style="font-size:13px;font-weight:600;color:#1a1a2e;">${sale.serviceName}</span></div>

    function getSettingsAppData() { return JSON.parse(sessionStorage.getItem("appData")); }

    function loadSettings() {

    async function changeUsuario() {
        const newUsuario = document.getElementById("new-username").value.trim();
        const password = document.getElementById("username-password").value;
        const msgEl = document.getElementById("username-message");
        msgEl.textContent = "";
        if (!newUsuario) { msgEl.style.color = "#e53e3e"; msgEl.textContent = "⚠️ Please enter a new username."; return; }
        if (newUsuario.length < 3) { msgEl.style.color = "#e53e3e"; msgEl.textContent = "⚠️ Usuario must be at least 3 characters."; return; }
        if (!password) { msgEl.style.color = "#e53e3e"; msgEl.textContent = "⚠️ Please enter your current password."; return; }
        const encrypted = localStorage.getItem("inventory-app-v1");
        if (!encrypted) { msgEl.style.color = "#e53e3e"; msgEl.textContent = "⚠️ No se encontraron datos guardados."; return; }
        msgEl.style.color = "#4f46e5"; msgEl.textContent = "Verificando contraseña...";
        const data = await Crypto.decrypt(encrypted, password);
        if (!data) { msgEl.style.color = "#e53e3e"; msgEl.textContent = "❌ Contraseña incorrecta."; return; }
        const exists = data.users.find(u => u.username.toLowerCase() === newUsuario.toLowerCase());
        if (exists) { msgEl.style.color = "#e53e3e"; msgEl.textContent = "❌ Ese nombre de usuario ya está en uso."; return; }
        const user = JSON.parse(sessionStorage.getItem("currentUser"));
        const userIndex = data.users.findIndex(u => u.username.toLowerCase() === user.username.toLowerCase());
        if (userIndex === -1) { msgEl.style.color = "#e53e3e"; msgEl.textContent = "❌ Usuario no encontrado."; return; }
        data.users[userIndex].username = newUsuario;
        user.username = newUsuario;
        sessionStorage.setItem("currentUser", JSON.stringify(user));
        sessionStorage.setItem("appData", JSON.stringify(data));
        await DB.save(data);
        const userEl = document.getElementById("current-user");
        if (userEl) userEl.textContent = `👤 ${newUsuario} (${user.role})`;
        const unEl = document.getElementById("settings-username");
        if (unEl) unEl.textContent = newUsuario;
        document.getElementById("new-username").value = "";
        document.getElementById("username-password").value = "";
        msgEl.style.color = "#38a169"; msgEl.textContent = "✅ Usuario updated successfully!";
    }

    async function changePassword() {
        const currentPwd = document.getElementById("current-password").value;
        const newPwd = document.getElementById("new-password").value;
        const confirmPwd = document.getElementById("confirm-password").value;
        const msgEl = document.getElementById("password-message");
        msgEl.textContent = "";
        if (!currentPwd || !newPwd || !confirmPwd) { msgEl.style.color = "#e53e3e"; msgEl.textContent = "⚠️ Por favor complete todos los campos de contraseña."; return; }
        if (newPwd.length < 6) { msgEl.style.color = "#e53e3e"; msgEl.textContent = "⚠️ La nueva contraseña debe tener al menos 6 caracteres."; return; }
        if (newPwd !== confirmPwd) { msgEl.style.color = "#e53e3e"; msgEl.textContent = "⚠️ Las contraseñas no coinciden."; return; }
        const encrypted = localStorage.getItem("inventory-app-v1");
        if (!encrypted) { msgEl.style.color = "#e53e3e"; msgEl.textContent = "⚠️ No se encontraron datos guardados."; return; }
        msgEl.style.color = "#4f46e5"; msgEl.textContent = "Verificando contraseña actual...";
        const data = await Crypto.decrypt(encrypted, currentPwd);
        if (!data) { msgEl.style.color = "#e53e3e"; msgEl.textContent = "❌ La contraseña actual es incorrecta."; return; }
        const user = JSON.parse(sessionStorage.getItem("currentUser"));
        const userIndex = data.users.findIndex(u => u.username.toLowerCase() === user.username.toLowerCase());
        if (userIndex === -1) { msgEl.style.color = "#e53e3e"; msgEl.textContent = "❌ Usuario no encontrado."; return; }
        msgEl.textContent = "Re-encriptando datos con la nueva contraseña...";
        data.users[userIndex].password = newPwd;
        sessionStorage.setItem("_sessionKey", btoa(newPwd));
        DB.setPassword(newPwd);
        sessionStorage.setItem("appData", JSON.stringify(data));
        const newEncrypted = await Crypto.encrypt(data, newPwd);
        localStorage.setItem("inventory-app-v1", newEncrypted);
        document.getElementById("current-password").value = "";
        document.getElementById("new-password").value = "";
        document.getElementById("confirm-password").value = "";
        msgEl.style.color = "#38a169"; msgEl.textContent = "✅ ¡Contraseña actualizada! Use su nueva contraseña la próxima vez.";
    }

    async function savePreferences() {
        const threshEl = document.getElementById("settings-threshold");
        const currEl = document.getElementById("settings-currency");
        const msgEl = document.getElementById("prefs-message");
        const threshold = parseInt(threshEl.value);
        const currency = currEl.value;
        if (!threshold || threshold < 1) { msgEl.style.color = "#e53e3e"; msgEl.textContent = "⚠️ Please enter a valid threshold."; return; }
        const data = getSettingsAppData();
        data.settings = data.settings || {};
        data.settings.lowStockThreshold = threshold;
        data.settings.currency = currency;
        AppConfig.lowStockThreshold = threshold;
        AppConfig.currency = currency;
        await saveSettingsAppData(data);
        msgEl.style.color = "#38a169"; msgEl.textContent = "✅ ¡Preferencias guardadas!";
        setTimeout(() => msgEl.textContent = "", 3000);
    }
    </script>
<script>
// ============================================
// DASHBOARD MODULE
// ============================================
function loadDashboard() {
    const data = JSON.parse(sessionStorage.getItem("appData"));
    const user = JSON.parse(sessionStorage.getItem("currentUser"));
    const currency = data.settings?.currency || AppConfig.currency || "MXN";
    const threshold = data.settings?.lowStockThreshold || AppConfig.lowStockThreshold || 5;

    function fmt(amount) { return `$${parseFloat(amount).toFixed(2)} ${currency}`; }
    function fmtDate(dateStr) { if (!dateStr) return "—"; const d = new Date(dateStr + "T00:00:00"); return d.toLocaleDateString("en-US", { month:"short", day:"numeric", year:"numeric" }); }

    const inventory = data.inventory || [];
    const movements = data.movements || [];
    const servicios = data.services || [];
    const serviceSales = data.serviceSales || [];

    // ---- WELCOME ----
    const hour = new Date().getHours();
    const greeting = hour < 12 ? "Buenos días" : hour < 18 ? "Buenas tardes" : "Buenas noches";
    document.getElementById("dash-welcome").textContent = `${greeting}, ${user.username}! Aquí está el resumen de su negocio.`;
