    const inventoryValue = inventory.reduce((sum, i) => sum + (i.price * i.quantity), 0);
    const serviceRevenue = serviceSales.reduce((sum, s) => sum + parseFloat(s.amount), 0);

    document.getElementById("dash-total-products").textContent = inventory.length;
    document.getElementById("dash-low-stock").textContent = lowStockItems.length;
    document.getElementById("dash-inventory-value").textContent = fmt(inventoryValue);
    document.getElementById("dash-service-revenue").textContent = fmt(serviceRevenue);
    document.getElementById("dash-total-servicios").textContent = servicios.length;
    document.getElementById("dash-total-sales").textContent = serviceSales.length;
    document.getElementById("dash-total-movements").textContent = movements.length;

    // ---- LOW STOCK ALERT ----
    const lowStockList = document.getElementById("dash-low-stock-list");
    if (lowStockItems.length === 0) {
        lowStockList.innerHTML = `
            <div style="padding:20px; text-align:center; color:#38a169; font-size:13px;">
                ✅ ¡Todos los artículos tienen stock suficiente!
            </div>`;
    } else {
        lowStockList.innerHTML = lowStockItems.map(item => `
            <div class="report-row">
                <div>
                    <div style="font-weight:600; color:#1a1a2e; font-size:14px;">${item.name}</div>
                    <div style="color:#888; font-size:12px;">${item.category || "—"}</div>
                </div>
                <div style="text-align:right;">
                    <div style="font-weight:700; color:#e53e3e; font-size:16px;">${item.quantity}</div>
                    <div style="color:#888; font-size:11px;">unidades restantes</div>
                </div>
            </div>`).join("");
    }

    // ---- TOP SERVICES ----
    const svcCount = {};
    serviceSales.forEach(s => {
        if (!svcCount[s.serviceName]) svcCount[s.serviceName] = { count: 0, revenue: 0 };
        svcCount[s.serviceName].count++;
        svcCount[s.serviceName].revenue += parseFloat(s.amount);
    });
    const topServicios = Object.entries(svcCount).sort((a, b) => b[1].revenue - a[1].revenue).slice(0, 5);
    const topServiciosEl = document.getElementById("dash-top-servicios");
    if (topServicios.length === 0) {
        topServiciosEl.innerHTML = `<div style="padding:20px; text-align:center; color:#888; font-size:13px;">Aún no hay ventas de servicios.</div>`;
    } else {
        const maxRev = topServicios[0][1].revenue || 1;
        topServiciosEl.innerHTML = topServicios.map(([name, val], index) => `
            <div style="margin-bottom:14px;">
                <div style="display:flex; justify-content:space-between; margin-bottom:4px;">
                    <span style="font-size:13px; font-weight:600; color:#1a1a2e;">${index + 1}. ${name}</span>
                    <span style="font-size:13px; color:#4f46e5; font-weight:600;">${fmt(val.revenue)}</span>
                </div>
                <div style="display:flex; align-items:center; gap:8px;">
                    <div style="flex:1; background:#f0f0f0; border-radius:20px; height:8px; overflow:hidden;">
                        <div style="background:#4f46e5; height:100%; border-radius:20px; width:${Math.round((val.revenue / maxRev) * 100)}%;"></div>

            </div>`).join("");
    }

    // ---- RECENT MOVEMENTS ----
    const recentMovements = [...movements].slice(0, 5);
    const recentMovEl = document.getElementById("dash-recent-movements");
    if (recentMovements.length === 0) {
        recentMovEl.innerHTML = `<div style="padding:20px; text-align:center; color:#888; font-size:13px;">Aún no hay movimientos registrados.</div>`;
    } else {
        recentMovEl.innerHTML = recentMovements.map(mov => `
            <div class="report-row">
                <div>
                    <div style="font-weight:600; color:#1a1a2e; font-size:13px;">${mov.productName}</div>
                    <div style="color:#888; font-size:11px;">${mov.person} · ${fmtDate(mov.date)}</div>
                </div>
                <div style="text-align:right;">
                    <div style="font-weight:700; color:#e53e3e; font-size:14px;">-${mov.quantity}</div>
                    <div style="color:#888; font-size:11px;">${mov.stockAfter} left</div>
                </div>
            </div>`).join("");
    }

    // ---- RECENT SALES ----
    const recentSales = [...serviceSales].slice(0, 5);
    const recentSalesEl = document.getElementById("dash-recent-sales");
    if (recentSales.length === 0) {
        recentSalesEl.innerHTML = `<div style="padding:20px; text-align:center; color:#888; font-size:13px;">Aún no hay ventas registradas.</div>`;
    } else {
        recentSalesEl.innerHTML = recentSales.map(sale => `
            <div class="report-row">
                <div>
                    <div style="font-weight:600; color:#1a1a2e; font-size:13px;">${sale.serviceName}</div>
                    <div style="color:#888; font-size:11px;">${sale.soldBy} · ${fmtDate(sale.date)}</div>
                </div>
                <div style="text-align:right;">
                    <div style="font-weight:700; color:#38a169; font-size:14px;">${fmt(sale.amount)}</div>
                </div>
            </div>`).join("");
    }
}
</script>
<script>
// ============================================
// CLIENTS MODULE
// ============================================
function getCliData() { return JSON.parse(sessionStorage.getItem("appData")); }
async function saveCliData(data) { sessionStorage.setItem("appData", JSON.stringify(data)); await DB.save(data); }
function generateCliId() { return "cli_" + Date.now() + "_" + Math.random().toString(36).substr(2, 9); }
function generateVehId() { return "veh_" + Date.now() + "_" + Math.random().toString(36).substr(2, 9); }
function generateSvcHistId() { return "svh_" + Date.now() + "_" + Math.random().toString(36).substr(2, 9); }
function formatCliDate(dateStr) { if (!dateStr) return "—"; const d = new Date(dateStr + "T00:00:00"); return d.toLocaleDateString("en-US", { year:"numeric", month:"short", day:"numeric" }); }
function fmtCli(amount) { const data = getCliData(); const currency = data.settings?.currency || AppConfig.currency || "MXN"; return `$${parseFloat(amount).toFixed(2)} ${currency}`; }

// ---- INIT ----
function loadClients() {
    const data = getCliData();
    if (!data.clients) data.clients = [];
    updateCliStats(data);
    renderClientsTable(data.clients);
}

// ---- STATS ----
function updateCliStats(data) {
    const clients = data.clients || [];
    const totalVehículos = clients.reduce((sum, c) => sum + (c.vehicles?.length || 0), 0);
    const totalServicios = clients.reduce((sum, c) => sum + (c.serviceHistory?.length || 0), 0);
    document.getElementById("cli-stat-total").textContent = clients.length;
    document.getElementById("cli-stat-vehicles").textContent = totalVehículos;
    document.getElementById("cli-stat-servicios").textContent = totalServicios;
}

// ---- RENDER TABLE ----
function renderClientsTable(clients) {
    const body = document.getElementById("cli-body");
    const emptyEl = document.getElementById("cli-empty");
    const table = document.getElementById("cli-table");
    if (!clients || clients.length === 0) { table.style.display = "none"; emptyEl.style.display = "block"; return; }
    table.style.display = "table"; emptyEl.style.display = "none"; body.innerHTML = "";
    clients.forEach(client => {
        const primaryVehículo = client.vehicles?.[0];
        const vehicleText = primaryVehículo
            ? `${primaryVehículo.make} ${primaryVehículo.model} ${primaryVehículo.year} — ${primaryVehículo.plate}`
            : "—";
        const extraVehículos = (client.vehicles?.length || 0) > 1
            ? ` <span style="color:#4f46e5; font-size:11px;">+${client.vehicles.length - 1} more</span>`
            : "";
        const row = document.createElement("tr");
        row.style.borderBottom = "1px solid #f0f0f0";
        row.style.cursor = "pointer";
        row.onclick = () => showClientProfile(client.id);
        const typeLabels = { material: "📦 Material", service: "🛠️ Service", both: "⭐ Both" };
        const typeColors = { material: "#4f46e5", service: "#38a169", both: "#d69e2e" };
        const typeLabel = typeLabels[client.clientTipo] || "⭐ Both";
        const typeColor = typeColors[client.clientTipo] || "#d69e2e";
        row.innerHTML = `
            <td style="padding:12px 16px; font-weight:600; color:#1a1a2e; font-size:14px;">
                ${client.name}
                <div style="font-size:11px; color:#aaa; font-weight:400;">${client.address || ""}</div>
            </td>
            <td style="padding:12px 16px; text-align:center;">
                <span style="background:${typeColor}20;color:${typeColor};padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600;">${typeLabel}</span>
            </td>
            <td style="padding:12px 16px; font-size:14px; color:#444;">${client.phone || "—"}</td>
            <td style="padding:12px 16px; font-size:13px; color:#444;">${vehicleText}${extraVehículos}</td>
            <td style="padding:12px 16px; text-align:center;">
                <span style="background:#f0f4ff; color:#4f46e5; padding:4px 10px; border-radius:20px; font-size:12px; font-weight:600;">
                    ${client.serviceHistory?.length || 0} servicios
                </span>
            </td>
            <td style="padding:12px 16px; text-align:center;" onclick="event.stopPropagation()">
                <button class="action-btn btn-edit" onclick="showAddClientForm('${client.id}')">✏️ Editar</button>
                <button class="action-btn btn-delete" onclick="deleteClient('${client.id}')">🗑️ Eliminar</button>
            </td>`;
        body.appendChild(row);
    });
}

// ---- FILTER ----
function filterClients() {
    const data = getCliData();
    const search = document.getElementById("cli-search").value.toLowerCase();
    const typeFilter = document.getElementById("cli-type-filter")?.value || "";
    let clients = data.clients || [];
    if (search) {
        clients = clients.filter(c =>
            c.name.toLowerCase().includes(search) ||
            (c.phone && c.phone.toLowerCase().includes(search)) ||
            (c.email && c.email.toLowerCase().includes(search)) ||
            (c.vehicles && c.vehicles.some(v =>
                (v.plate && v.plate.toLowerCase().includes(search)) ||
                (v.make && v.make.toLowerCase().includes(search)) ||
                (v.model && v.model.toLowerCase().includes(search))
            ))
        );
    }
    if (typeFilter) {
        clients = clients.filter(c =>
            c.clientTipo === typeFilter ||
            (typeFilter === "material" && !c.clientTipo) ||
            (c.clientTipo === "both")
        );
    }
    renderClientsTable(clients);
}
// ---- DELETE CLIENT ----
async function deleteClient(id) {
    if (!confirm("¿Eliminar este cliente y todos sus datos??")) return;
    const data = getCliData();
    data.clients = data.clients.filter(c => c.id !== id);
    await saveCliData(data);
    loadClients();
}

// ---- ADD/EDIT CLIENT FORM ----

                            <input type="radio" name="cli-client-type" id="cli-type-service" value="service" ${client?.clientTipo === 'service' ? 'checked' : ''} onchange="updateClientTipoStyle()" style="accent-color:#4f46e5;">
                            🛠️ Cliente de Servicios
                        </label>
                        <label style="flex:1;display:flex;align-items:center;gap:8px;padding:10px 14px;border:2px solid ${client?.clientTipo === 'both' ? '#4f46e5' : '#ddd'};border-radius:8px;cursor:pointer;font-size:13px;" id="cli-type-both-label">
                            <input type="radio" name="cli-client-type" id="cli-type-both" value="both" ${client?.clientTipo === 'both' ? 'checked' : ''} onchange="updateClientTipoStyle()" style="accent-color:#4f46e5;">

                        </label>
                    </div>

                <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;">
                    <div><label style="display:block;font-size:12px;font-weight:600;color:#888;margin-bottom:4px;">Email</label>
                    <input type="email" id="cli-form-email" value="${client?.email || ''}" placeholder="email@example.com" style="width:100%;padding:8px 12px;border:1px solid #ddd;border-radius:8px;font-size:14px;outline:none;"></div>
                    <div><label style="display:block;font-size:12px;font-weight:600;color:#888;margin-bottom:4px;">Dirección</label>
                    <input type="text" id="cli-form-address" value="${client?.address || ''}" placeholder="Calle, Ciudad" style="width:100%;padding:8px 12px;border:1px solid #ddd;border-radius:8px;font-size:14px;outline:none;"></div>

function closeClientForm() { const o = document.getElementById("client-form-overlay"); if (o) o.remove(); }

// ---- SAVE CLIENT ----
async function saveClient(id) {
    const name = document.getElementById("cli-form-name").value.trim();
    const phone = document.getElementById("cli-form-phone").value.trim();
    const email = document.getElementById("cli-form-email").value.trim();
    const address = document.getElementById("cli-form-address").value.trim();
    const notes = document.getElementById("cli-form-notes").value.trim();
    const make = document.getElementById("cli-form-make").value.trim();
    const model = document.getElementById("cli-form-model").value.trim();
    const year = document.getElementById("cli-form-year").value.trim();
    const plate = document.getElementById("cli-form-plate").value.trim();
    const color = document.getElementById("cli-form-color").value.trim();
    const type = document.getElementById("cli-form-type").value;
    const errorEl = document.getElementById("cli-form-error");

    if (!name) { errorEl.textContent = "⚠️ El nombre del cliente es requerido."; return; }
const clientTipo = document.querySelector('input[name="cli-client-type"]:checked')?.value || "both";

    const data = getCliData();
    if (!data.clients) data.clients = [];

    const vehicle = (make || model || plate) ? {
        id: id ? (data.clients.find(c => c.id === id)?.vehicles?.[0]?.id || generateVehId()) : generateVehId(),
        make, model, year, plate, color, type
    } : null;

    if (id) {
        const index = data.clients.findIndex(c => c.id === id);
        if (index !== -1) {
            const existing = data.clients[index];
            data.clients[index] = {
                ...existing,
                name, phone, email, address, notes, clientTipo,
                vehicles: vehicle ? [vehicle, ...(existing.vehicles?.slice(1) || [])] : existing.vehicles || [],
                updatedAt: new Date().toISOString()
            };
        }
    } else {
        data.clients.push({
            id: generateCliId(),
            name, phone, email, address, notes, clientTipo,
            vehicles: vehicle ? [vehicle] : [],
            serviceHistory: [],
            createdAt: new Date().toISOString()
        });
    }

    await saveCliData(data);
    closeClientForm();
    loadClients();
}

// ---- CLIENT PROFILE ----

                        <button class="action-btn btn-delete" onclick="deleteServiceHistory('${id}','${s.id}')">🗑️</button>

                </tr>`).join("")}
            </tbody>
           </table>`;

            <!-- Profile Header -->
            <div style="background:#1a1a2e;padding:24px 28px;border-radius:12px 12px 0 0;display:flex;justify-content:space-between;align-items:center;">
                <div>
                    <div style="font-size:22px;font-weight:800;color:white;">${client.name}</div>
                    <div style="color:#aaa;font-size:13px;margin-top:4px;">
                        ${client.phone ? `📞 ${client.phone}` : ""}
                        ${client.email ? ` · ✉️ ${client.email}` : ""}
                    </div>
                </div>
                <button onclick="closeClientProfile()" style="background:rgba(255,255,255,0.1);border:none;color:white;font-size:18px;cursor:pointer;padding:6px 12px;border-radius:8px;">✕</button>
            </div>

            <div style="padding:24px 28px;">

                <!-- Client Info -->
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px;">

async function saveSvcHistory(clientId) {
    const date = document.getElementById("svh-form-date").value;
    const service = document.getElementById("svh-form-service").value.trim();
    const amount = document.getElementById("svh-form-amount").value;
    const notes = document.getElementById("svh-form-notes").value.trim();
    const errorEl = document.getElementById("svh-form-error");

    if (!date) { errorEl.textContent = "⚠️ Por favor seleccione una fecha."; return; }
    if (!service) { errorEl.textContent = "⚠️ Please enter the service name."; return; }

    const data = getCliData();
    const client = data.clients.find(c => c.id === clientId);
    if (!client) return;

    if (!client.serviceHistory) client.serviceHistory = [];
    client.serviceHistory.unshift({
        id: generateSvcHistId(),
        date, service,
        amount: amount ? parseFloat(amount) : null,
        notes,
        createdAt: new Date().toISOString()
    });

    await saveCliData(data);
    closeSvcHistoryForm();
    closeClientProfile();
    showClientProfile(clientId);
    updateCliStats(data);
}

// ---- DELETE SERVICE HISTORY ----
async function deleteServiceHistory(clientId, serviceId) {
    if (!confirm("¿Eliminar este registro de servicio??")) return;
    const data = getCliData();
    const client = data.clients.find(c => c.id === clientId);
    if (!client) return;
    client.serviceHistory = client.serviceHistory.filter(s => s.id !== serviceId);
    await saveCliData(data);
    closeClientProfile();
    showClientProfile(clientId);
    updateCliStats(data);
}

<script>
// ============================================
// INVENTORY TABS + MOVEMENTS + CARTERA
// ============================================

// ---- TAB SWITCHING ----
function switchInvTab(tab) {
    ["materials", "movements", "cartera", "special"].forEach(t => {
        const content = document.getElementById(`inv-tab-content-${t}`);
        const btn = document.getElementById(`inv-tab-${t}`);
        if (content) content.style.display = t === tab ? "block" : "none";
        if (btn) btn.classList.toggle("active", t === tab);
    });

    // Show/hide header buttons
    const headerBtns = document.getElementById("inv-header-buttons");
    if (headerBtns) headerBtns.style.display = tab === "materials" ? "flex" : "none";

    // Load tab content
    if (tab === "movements") initMov2();
    if (tab === "cartera") loadCartera();
    if (tab === "special") initSpecialPrices();
}

// ---- FORMAT HELPERS ----
function fmt2(amount) {
    const data = getAppData();
    const currency = data.settings?.currency || AppConfig.currency || "MXN";
    return `$${parseFloat(amount || 0).toFixed(2)} ${currency}`;
}

function fmtDate2(dateStr) {
    if (!dateStr) return "—";
    const d = new Date(dateStr + "T00:00:00");
    return d.toLocaleDateString("en-US", { year:"numeric", month:"short", day:"numeric" });
}

function daysDiff(dateStr) {
    if (!dateStr) return 0;
    const due = new Date(dateStr + "T00:00:00");
    const today = new Date();
    today.setHours(0,0,0,0);
    return Math.floor((today - due) / (1000 * 60 * 60 * 24));
}

function getUnitLabel(unit) {
    const labels = { ml: "ml", m2: "m²", piezas: "pzs", rollos: "rollos", litros: "lts" };
    return labels[unit] || unit || "pzs";
}

// ============================================
// MOVEMENTS TAB
// ============================================
function initMov2() {
    const data = getAppData();
    const today = new Date().toISOString().split("T")[0];

    // Set date
    const dateEl = document.getElementById("mov2-date");
    if (dateEl) dateEl.value = today;

    // Populate material dropdown
    const matSelect = document.getElementById("mov2-product");
    if (matSelect) {
        matSelect.innerHTML = `<option value="">— Seleccione material —</option>`;
        (data.inventory || []).forEach(item => {
            const opt = document.createElement("option");
            opt.value = item.id;
            opt.textContent = `${item.name} (${item.quantity} ${getUnitLabel(item.unit)} available)`;
            matSelect.appendChild(opt);
        });
    }

   // Populate client dropdown — material buyers and both only
    const cliSelect = document.getElementById("mov2-client");
    if (cliSelect) {
        cliSelect.innerHTML = `<option value="">— Seleccione cliente (opcional) —</option>`;
        (data.clients || []).filter(c =>
            !c.clientTipo || c.clientTipo === "material" || c.clientTipo === "both"
        ).forEach(c => {
            const opt = document.createElement("option");
            opt.value = c.id;
            opt.textContent = `${c.name} ${c.clientTipo === 'both' ? '⭐' : '📦'}`;
            cliSelect.appendChild(opt);
        });
    }
    // Render history
    renderMov2Table(data.inventoryMovements || []);
}

function onMov2ProductChange() {
    const data = getAppData();
    const productId = document.getElementById("mov2-product").value;
    const indicator = document.getElementById("mov2-stock-indicator");
    const priceEl = document.getElementById("mov2-unit-price");

    if (!productId) { indicator.style.display = "none"; return; }

    const item = data.inventory.find(i => i.id === productId);
    if (!item) return;

    // Show stock
    indicator.style.display = "block";
    const threshold = item.threshold || AppConfig.lowStockThreshold || 5;
    const isLow = item.quantity <= threshold;
    indicator.style.background = isLow ? "#fff5f5" : "#f0fff4";
    indicator.style.borderColor = isLow ? "#fed7d7" : "#c6f6d5";
    indicator.style.color = isLow ? "#c53030" : "#276749";
    indicator.textContent = `${isLow ? '⚠️' : '✅'} ${item.quantity} ${getUnitLabel(item.unit)} available · Cost: ${fmt2(item.cost)} · Sale: ${fmt2(item.price)}`;

    // Auto fill price
    priceEl.value = item.price || "";

    // Check special price for selected client
    checkSpecialPriceAlert();
    calcMov2Total();
}

function onMov2ClientChange() {
    checkSpecialPriceAlert();
}

function checkSpecialPriceAlert() {
    const data = getAppData();
    const productId = document.getElementById("mov2-product").value;
    const clientId = document.getElementById("mov2-client").value;
    const alertEl = document.getElementById("mov2-special-price-alert");
    const priceEl = document.getElementById("mov2-unit-price");

    if (!productId || !clientId) { alertEl.style.display = "none"; return; }

    // Check for special price
    const specialPrices = data.specialPrices || [];
    const sp = specialPrices.find(s => s.materialId === productId && s.clientId === clientId);

    if (sp) {
        alertEl.style.display = "block";
        alertEl.innerHTML = `⭐ This client has a special price for this material: <strong>${fmt2(sp.price)}</strong> (regular: ${fmt2(data.inventory.find(i => i.id === productId)?.price)}). <button onclick="applySpecialPrice(${sp.price})" style="margin-left:8px;padding:2px 8px;background:#4f46e5;color:white;border:none;border-radius:4px;cursor:pointer;font-size:12px;">Apply</button>`;
    } else {
        alertEl.style.display = "none";
    }
}

function applySpecialPrice(price) {
    document.getElementById("mov2-unit-price").value = price;
    calcMov2Total();
}

function onMov2PaymentChange() {
    const payment = document.getElementById("mov2-payment").value;
    const dueDateField = document.getElementById("mov2-due-date-field");
    if (dueDateField) dueDateField.style.display = payment === "credito" ? "block" : "none";
}

function calcMov2Total() {
    const qty = parseFloat(document.getElementById("mov2-quantity")?.value || 0);
    const price = parseFloat(document.getElementById("mov2-unit-price")?.value || 0);
    const totalEl = document.getElementById("mov2-total");
    if (totalEl) totalEl.value = (qty * price).toFixed(2);
}

async function saveMov2() {
    const data = getAppData();
    const productId = document.getElementById("mov2-product").value;
    const clientId = document.getElementById("mov2-client").value;
    const movTipo = document.getElementById("mov2-type").value;
    const payment = document.getElementById("mov2-payment").value;
    const quantity = parseFloat(document.getElementById("mov2-quantity").value);
    const date = document.getElementById("mov2-date").value;
    const unitPrice = parseFloat(document.getElementById("mov2-unit-price").value);
    const dueDate = document.getElementById("mov2-due-date").value;
    const notes = document.getElementById("mov2-notes").value.trim();
    const errorEl = document.getElementById("mov2-error");

    errorEl.textContent = "";
    errorEl.style.color = "#e53e3e";

    if (!productId) { errorEl.textContent = "⚠️ Por favor seleccione un material."; return; }
    if (!quantity || quantity <= 0) { errorEl.textContent = "⚠️ Por favor ingrese una cantidad válida."; return; }
    if (!date) { errorEl.textContent = "⚠️ Por favor seleccione una fecha."; return; }
    if (!unitPrice || unitPrice < 0) { errorEl.textContent = "⚠️ Por favor ingrese un precio unitario válido."; return; }
    if (payment === "credito" && !dueDate) { errorEl.textContent = "⚠️ Por favor seleccione una fecha de vencimiento para ventas a crédito."; return; }

    const item = data.inventory.find(i => i.id === productId);
    if (!item) { errorEl.textContent = "⚠️ Material no encontrado."; return; }
    if (quantity > item.quantity) { errorEl.textContent = `⚠️ ¡Stock insuficiente! Only ${item.quantity} ${getUnitLabel(item.unit)} available.`; return; }

    const client = clientId ? (data.clients || []).find(c => c.id === clientId) : null;
    const stockBefore = item.quantity;
    item.quantity = parseFloat((item.quantity - quantity).toFixed(4));
    const stockAfter = item.quantity;

    if (!data.inventoryMovements) data.inventoryMovements = [];

    const movement = {
        id: "imov_" + Date.now() + "_" + Math.random().toString(36).substr(2, 9),
        productId, productName: item.name, unit: item.unit,
        clientId: clientId || null, clientName: client?.name || null,
        movTipo, payment,
        quantity, unitPrice,
        total: parseFloat((quantity * unitPrice).toFixed(2)),
        stockBefore, stockAfter,
        date, dueDate: payment === "credito" ? dueDate : null,
        paid: payment === "contado",
        notes,
        createdAt: new Date().toISOString()
    };

    data.inventoryMovements.unshift(movement);
    await saveAppData(data);

    // Reset form
    document.getElementById("mov2-product").value = "";
    document.getElementById("mov2-client").value = "";
    document.getElementById("mov2-quantity").value = "";
    document.getElementById("mov2-unit-price").value = "";
    document.getElementById("mov2-total").value = "";
    document.getElementById("mov2-notes").value = "";
    document.getElementById("mov2-date").value = new Date().toISOString().split("T")[0];
    document.getElementById("mov2-payment").value = "contado";
    document.getElementById("mov2-due-date-field").style.display = "none";
    document.getElementById("mov2-stock-indicator").style.display = "none";
    document.getElementById("mov2-special-price-alert").style.display = "none";

    errorEl.style.color = "#38a169";
    errorEl.textContent = `✅ ¡Movimiento registrado! ${item.name} stock reducido de ${stockBefore} to ${stockAfter} ${getUnitLabel(item.unit)}.`;
    setTimeout(() => { errorEl.textContent = ""; errorEl.style.color = "#e53e3e"; }, 4000);

    // Refresh dropdowns and table
    initMov2();
    if (typeof updateSidebarBadges === "function") updateSidebarBadges();
}

function filterMov2() {
    const data = getAppData();
    const search = document.getElementById("mov2-search")?.value.toLowerCase() || "";
    const typeFilter = document.getElementById("mov2-filter-type")?.value || "";
    const paymentFilter = document.getElementById("mov2-filter-payment")?.value || "";

    let movements = data.inventoryMovements || [];
    if (search) movements = movements.filter(m =>
        m.productName.toLowerCase().includes(search) ||
        (m.clientName && m.clientName.toLowerCase().includes(search))
    );
    if (typeFilter) movements = movements.filter(m => m.movTipo === typeFilter);
    if (paymentFilter) movements = movements.filter(m => m.payment === paymentFilter);
    renderMov2Table(movements);
}

function renderMov2Table(movements) {
    const body = document.getElementById("mov2-body");
    const emptyEl = document.getElementById("mov2-empty");
    const table = document.getElementById("mov2-table");
    if (!movements || movements.length === 0) { table.style.display = "none"; emptyEl.style.display = "block"; return; }
    table.style.display = "table"; emptyEl.style.display = "none"; body.innerHTML = "";

    movements.forEach(mov => {
        const isVencido = mov.payment === "credito" && !mov.paid && mov.dueDate && daysDiff(mov.dueDate) > 0;
        const row = document.createElement("tr");
        row.style.borderBottom = "1px solid #f0f0f0";
        if (isVencido) row.style.background = "#fff8f8";

        row.innerHTML = `
            <td style="padding:10px 16px;font-size:13px;color:#666;">${fmtDate2(mov.date)}</td>
            <td style="padding:10px 16px;font-size:13px;font-weight:600;color:#1a1a2e;">${mov.productName}</td>

async function markAsPaid(id) {
    if (!confirm("¿Marcar este pago como pagado??")) return;

    const mov = (data.inventoryMovements || []).find(m => m.id === id);

    await saveAppData(data);
    renderMov2Table(data.inventoryMovements || []);
    loadCartera();
}

async function deleteMov2(id) {
    if (!confirm("Delete this movement? Stock will NOT be restored.")) return;
    const data = getAppData();
    data.inventoryMovements = (data.inventoryMovements || []).filter(m => m.id !== id);
    await saveAppData(data);
    renderMov2Table(data.inventoryMovements || []);
}

// ============================================
// CARTERA TAB
// ============================================
function loadCartera() {
    const data = getAppData();
    const movements = data.inventoryMovements || [];
    const pending = movements.filter(m => m.payment === "credito" && !m.paid);

    const total = pending.reduce((sum, m) => sum + m.total, 0);
    const overdue = pending.filter(m => m.dueDate && daysDiff(m.dueDate) > 0).length;

    const totalEl = document.getElementById("cartera-total");
    const overdueEl = document.getElementById("cartera-overdue-count");
    if (totalEl) totalEl.textContent = fmt2(total);
    if (overdueEl) overdueEl.textContent = overdue;

    const body = document.getElementById("cartera-body");
    const emptyEl = document.getElementById("cartera-empty");
    const table = document.getElementById("cartera-table");

    if (!pending || pending.length === 0) {
        if (table) table.style.display = "none";
        if (emptyEl) emptyEl.style.display = "block";
        return;
    }

    if (table) table.style.display = "table";
    if (emptyEl) emptyEl.style.display = "none";
    if (body) body.innerHTML = "";

    // Sort by overdue first
    pending.sort((a, b) => daysDiff(b.dueDate) - daysDiff(a.dueDate));

    pending.forEach(mov => {
        const days = daysDiff(mov.dueDate);
        const isVencido = days > 0;
        const row = document.createElement("tr");
        row.style.borderBottom = "1px solid #f0f0f0";
        if (isVencido) row.style.background = "#fff8f8";

        row.innerHTML = `
            <td style="padding:12px 16px;font-weight:600;color:#1a1a2e;font-size:14px;">${mov.clientName || '<span style="color:#aaa;">Sin cliente</span>'}</td>
            <td style="padding:12px 16px;font-size:13px;color:#444;">${mov.productName}</td>
            <td style="padding:12px 16px;font-size:13px;color:#666;">${fmtDate2(mov.date)}</td>
            <td style="padding:12px 16px;font-size:13px;color:${isVencido ? '#e53e3e' : '#444'};font-weight:${isVencido ? '700' : '400'};">${fmtDate2(mov.dueDate)}</td>
            <td style="padding:12px 16px;text-align:center;">
                <span style="background:${isVencido ? '#fff5f5' : days === 0 ? '#fffbeb' : '#f0fff4'};color:${isVencido ? '#e53e3e' : days === 0 ? '#c05621' : '#38a169'};padding:4px 10px;border-radius:20px;font-size:12px;font-weight:700;">
                    ${isVencido ? `⚠️ ${days}d días vencido` : days === 0 ? '⏰ Vence hoy' : `✅ ${Math.abs(days)}d restantes`}
                </span>
            </td>
            <td style="padding:12px 16px;text-align:right;font-weight:800;color:#e53e3e;font-size:15px;">${fmt2(mov.total)}</td>
            <td style="padding:12px 16px;text-align:center;">
                <button class="action-btn btn-edit" onclick="markAsPaid('${mov.id}')">✅ Marcar Pagado</button>
            </td>`;
        body.appendChild(row);
    });
}

function initSpecialPrices() {
    const data = getAppData();

    // Populate client dropdown
    const cliSelect = document.getElementById("sp-client");
    if (cliSelect) {
        cliSelect.innerHTML = `<option value="">— Seleccione cliente —</option>`;

            const opt = document.createElement("option");
            opt.value = c.id; opt.textContent = c.name;
            cliSelect.appendChild(opt);
        });
    }

    // Populate material dropdown
    const matSelect = document.getElementById("sp-material");
    if (matSelect) {
        matSelect.innerHTML = `<option value="">— Seleccione material —</option>`;
        (data.inventory || []).forEach(item => {
            const opt = document.createElement("option");
            opt.value = item.id; opt.textContent = `${item.name} (regular: ${fmt2(item.price)})`;
            matSelect.appendChild(opt);
        });
    }

    renderSpecialPrices(data.specialPrices || []);
}

async function saveSpecialPrice() {
    const clientId = document.getElementById("sp-client").value;
    const materialId = document.getElementById("sp-material").value;
    const price = document.getElementById("sp-price").value;
    const errorEl = document.getElementById("sp-error");

    errorEl.textContent = "";
    if (!clientId) { errorEl.style.color = "#e53e3e"; errorEl.textContent = "⚠️ Por favor seleccione un cliente."; return; }
    if (!materialId) { errorEl.style.color = "#e53e3e"; errorEl.textContent = "⚠️ Por favor seleccione un material."; return; }
    if (!price || parseFloat(price) < 0) { errorEl.style.color = "#e53e3e"; errorEl.textContent = "⚠️ Por favor ingrese un precio válido."; return; }

    const data = getAppData();
    if (!data.specialPrices) data.specialPrices = [];

    // Check if already exists — update instead
    const existing = data.specialPrices.find(s => s.clientId === clientId && s.materialId === materialId);
    if (existing) {
        existing.price = parseFloat(price);
        existing.updatedAt = new Date().toISOString();
    } else {
        const client = (data.clients || []).find(c => c.id === clientId);
        const material = (data.inventory || []).find(i => i.id === materialId);
        data.specialPrices.push({
            id: "sp_" + Date.now(),
            clientId, clientName: client?.name || "",
            materialId, materialName: material?.name || "",
            regularPrice: material?.price || 0,
            price: parseFloat(price),
            createdAt: new Date().toISOString()
        });
    }

    await saveAppData(data);
    document.getElementById("sp-client").value = "";
    document.getElementById("sp-material").value = "";
    document.getElementById("sp-price").value = "";
    errorEl.style.color = "#38a169";
    errorEl.textContent = "✅ ¡Precio especial guardado!";
    setTimeout(() => errorEl.textContent = "", 3000);
    renderSpecialPrices(data.specialPrices);
}

async function deleteSpecialPrice(id) {
    if (!confirm("¿Eliminar este precio especial??")) return;
    const data = getAppData();
    data.specialPrices = (data.specialPrices || []).filter(s => s.id !== id);
    await saveAppData(data);
    renderSpecialPrices(data.specialPrices);
}

function renderSpecialPrices(prices) {
    const body = document.getElementById("sp-body");
    const emptyEl = document.getElementById("sp-empty");
    const table = document.getElementById("sp-table");
    if (!prices || prices.length === 0) { table.style.display = "none"; emptyEl.style.display = "block"; return; }
    table.style.display = "table"; emptyEl.style.display = "none"; body.innerHTML = "";

    prices.forEach(sp => {
        const discount = sp.regularPrice > 0 ? (((sp.regularPrice - sp.price) / sp.regularPrice) * 100).toFixed(0) : 0;
        const row = document.createElement("tr");
        row.style.borderBottom = "1px solid #f0f0f0";
        row.innerHTML = `
            <td style="padding:12px 16px;font-weight:600;color:#1a1a2e;font-size:14px;">${sp.clientName}</td>
            <td style="padding:12px 16px;font-size:14px;color:#444;">${sp.materialName}</td>
            <td style="padding:12px 16px;text-align:right;font-size:14px;color:#888;text-decoration:line-through;">${fmt2(sp.regularPrice)}</td>
            <td style="padding:12px 16px;text-align:right;font-size:14px;font-weight:700;color:#4f46e5;">${fmt2(sp.price)}</td>
            <td style="padding:12px 16px;text-align:right;">
                <span style="background:#fff5f5;color:#e53e3e;padding:3px 8px;border-radius:20px;font-size:12px;font-weight:600;">-${discount}%</span>
            </td>
            <td style="padding:12px 16px;text-align:center;">
                <button class="action-btn btn-delete" onclick="deleteSpecialPrice('${sp.id}')">🗑️ Eliminar</button>
            </td>`;
        body.appendChild(row);
    });
}
</script>
<script>
// ============================================
// BATCH TRACKING
// ============================================

// Temporary batch storage while form is open
let currentBatches = [];

// Initialize batches when form opens
function initBatches(existingBatches) {
    currentBatches = existingBatches ? [...existingBatches] : [];
    renderBatchList();
}

// Add a new batch entry
function addBatchEntry() {
    const itemNum = document.getElementById("batch-item-num").value.trim();
    const location = document.getElementById("batch-location").value.trim();
    const total = document.getElementById("batch-total").value;
    const date = document.getElementById("batch-date").value;

    if (!itemNum) { alert("⚠️ Por favor ingrese un número de artículo."); return; }
    if (!total || parseFloat(total) <= 0) { alert("⚠️ Por favor ingrese un total válido."); return; }

    const batch = {
        id: "batch_" + Date.now() + "_" + Math.random().toString(36).substr(2, 6),
        itemNum,
        location,
        total: parseFloat(total),
        date,
        addedAt: new Date().toISOString()
    };

    currentBatches.push(batch);
    renderBatchList();

    // Clear fields
    document.getElementById("batch-item-num").value = "";
    document.getElementById("batch-location").value = "";
    document.getElementById("batch-total").value = "";
    document.getElementById("batch-date").value = "";
}

// Remove a batch entry
function removeBatch(id) {
    currentBatches = currentBatches.filter(b => b.id !== id);
    renderBatchList();
}

// Render the batch list
function renderBatchList() {
    const container = document.getElementById("batch-list");
    if (!container) return;

    if (currentBatches.length === 0) {
        container.innerHTML = `
            <div style="text-align:center;padding:16px;color:#aaa;font-size:13px;border:1px dashed #ddd;border-radius:8px;">
                Aún no hay lotes. Use el formulario de arriba para agregar lotes.
            </div>`;
        return;
    }

    container.innerHTML = `
        <div style="border:1px solid #eee;border-radius:8px;overflow:hidden;">
            <table style="width:100%;border-collapse:collapse;font-size:12px;">
                <thead>
                    <tr style="background:#f8f9fa;border-bottom:2px solid #eee;">
                        <th style="padding:8px 12px;text-align:left;color:#444;">Item #</th>
                        <th style="padding:8px 12px;text-align:left;color:#444;">Ubicación</th>
                        <th style="padding:8px 12px;text-align:center;color:#444;">Total en Lote</th>
                        <th style="padding:8px 12px;text-align:center;color:#444;">Fecha de Recepción</th>
                        <th style="padding:8px 12px;text-align:center;color:#444;">Remove</th>
                    </tr>
                </thead>
                <tbody>
                    ${currentBatches.map(b => `
                        <tr style="border-bottom:1px solid #f0f0f0;">
                            <td style="padding:8px 12px;font-weight:600;color:#1a1a2e;">${b.itemNum}</td>
                            <td style="padding:8px 12px;color:#666;">${b.location || '—'}</td>
                            <td style="padding:8px 12px;text-align:center;font-weight:600;color:#4f46e5;">${b.total}</td>
                            <td style="padding:8px 12px;text-align:center;color:#666;">${b.date ? new Date(b.date + "T00:00:00").toLocaleDateString("en-US", {month:"short",day:"numeric",year:"numeric"}) : '—'}</td>
                            <td style="padding:8px 12px;text-align:center;">
                                <button onclick="removeBatch('${b.id}')" style="background:#fff5f5;color:#e53e3e;border:none;border-radius:4px;padding:3px 8px;cursor:pointer;font-size:11px;font-weight:600;">🗑️</button>
                            </td>
                        </tr>`).join("")}
                </tbody>
                <tfoot>
                    <tr style="background:#f8f9fa;border-top:2px solid #eee;">
                        <td colspan="2" style="padding:8px 12px;font-weight:700;color:#444;">Total de todos los lotes:</td>
                        <td style="padding:8px 12px;text-align:center;font-weight:800;color:#4f46e5;">
                            ${currentBatches.reduce((sum, b) => sum + b.total, 0).toFixed(2)}
                        </td>
                        <td colspan="2"></td>
                    </tr>
                </tfoot>
            </table>
        </div>`;
}
</script>

async function handleBrandLogoUpload(event) {
    const file = event.target.files[0];
    if (!file) return;

    if (file.size > 2 * 1024 * 1024) {
        alert("⚠️ La imagen es demasiado grande. Use una imagen menor a 2MB.");
        return;
    }

    const reader = new FileReader();
    reader.onload = async function(e) {
        const base64 = e.target.result;

        // Show preview
        const preview = document.getElementById("brand-logo-preview");
        if (preview) preview.innerHTML = `<img src="${base64}" style="width:100%;height:100%;object-fit:contain;" />`;

        const removeBtn = document.getElementById("brand-remove-logo");
        if (removeBtn) removeBtn.style.display = "inline-block";

        // Save to data
        let data = JSON.parse(sessionStorage.getItem("appData"));
        if (!data.companyInfo) data.companyInfo = {};
        data.companyInfo.logo = base64;

        sessionStorage.setItem("appData", JSON.stringify(data));

        const pwd = DB.getPassword();
        if (pwd) {
            const encrypted = await Crypto.encrypt(data, pwd);
            localStorage.setItem("inventory-app-v1", encrypted);
        }

        // Refresh sidebar
        if (typeof loadSidebarBranding === "function") loadSidebarBranding();
    };
    reader.readAsDataURL(file);
}

async function removeBrandLogo() {
    if (!confirm("¿Eliminar el logo del negocio?")) return;

    let data = JSON.parse(sessionStorage.getItem("appData"));
    if (data.companyInfo) delete data.companyInfo.logo;

    sessionStorage.setItem("appData", JSON.stringify(data));

    const pwd = DB.getPassword();
    if (pwd) {
        const encrypted = await Crypto.encrypt(data, pwd);
        localStorage.setItem("inventory-app-v1", encrypted);
    }

    const preview = document.getElementById("brand-logo-preview");
    if (preview) preview.innerHTML = "🏢";

    const removeBtn = document.getElementById("brand-remove-logo");
    if (removeBtn) removeBtn.style.display = "none";

    const input = document.getElementById("brand-logo-input");
    if (input) input.value = "";

    // Refresh sidebar
    if (typeof loadSidebarBranding === "function") loadSidebarBranding();
}
</script>
<script>
// ============================================
// MÓDULO DE NÓMINA
// ============================================
function getNomData() { return JSON.parse(sessionStorage.getItem("appData")); }
async function saveNomData(data) { sessionStorage.setItem("appData", JSON.stringify(data)); await DB.save(data); }
function generateNomId() { return "nom_" + Date.now() + "_" + Math.random().toString(36).substr(2,6); }
function fmtNom(amount) { const d = getNomData(); const c = d.settings?.currency || "MXN"; return `$${parseFloat(amount||0).toFixed(2)} ${c}`; }
function fmtNomDate(dateStr) { if (!dateStr) return "—"; const d = new Date(dateStr + "T00:00:00"); return d.toLocaleDateString("es-MX", {day:"2-digit",month:"short",year:"numeric"}); }

// ---- TAB SWITCHING ----
function switchNominaTab(tab) {
    ["empleados","semana","historial"].forEach(t => {
        const el = document.getElementById(`nom-tab-${t}`);
        const btn = document.getElementById(`nom-btn-${t}`);
        if (el) el.style.display = t === tab ? "block" : "none";
        if (btn) btn.style.background = t === tab ? "#4f46e5" : "#1a1a2e";
    });
    if (tab === "semana") initNominaSemana();
    if (tab === "historial") loadNominaHistorial();
}

// ---- INIT ----
function loadNomina() {
    const data = getNomData();
    if (!data.empleados) data.empleados = [];
    if (!data.nominaHistorial) data.nominaHistorial = [];
    if (!data.comisiones) data.comisiones = [];

    // Set today's date for ingreso
    const hoy = new Date().toISOString().split("T")[0];
    const ingresoEl = document.getElementById("emp-ingreso");
    if (ingresoEl) ingresoEl.value = hoy;

    updateNomStats(data);
    renderEmpleados(data.empleados);
    loadPrestamos();
}

// ---- PRÉSTAMOS SOBRE NÓMINA ----
function loadPrestamos() {
    const data = getNomData();
    const empleados = data.empleados || [];

    // Populate employee dropdown
    const select = document.getElementById("prestamo-empleado");
    if (select) {
        select.innerHTML = '<option value="">— Seleccione empleado —</option>';
        empleados.forEach(emp => {
            const opt = document.createElement("option");
            opt.value = emp.id;
            opt.textContent = emp.nombre;
            select.appendChild(opt);
        });
    }

    renderPrestamos(data.prestamos || []);
}

function renderPrestamos(prestamos) {
    const body = document.getElementById("prestamo-body");
    const emptyEl = document.getElementById("prestamo-empty");
    const table = document.getElementById("prestamo-table");
    if (!body) return;

    if (!prestamos || prestamos.length === 0) {
        table.style.display = "none"; emptyEl.style.display = "block"; return;
    }
    table.style.display = "table"; emptyEl.style.display = "none"; body.innerHTML = "";

    prestamos.forEach(p => {
        const saldado = p.saldo <= 0;
        const row = document.createElement("tr");
        row.style.borderBottom = "1px solid #f0f0f0";
        if (saldado) row.style.opacity = "0.6";
        row.innerHTML = `
            <td style="padding:10px 14px;font-weight:600;color:#1a1a2e;font-size:14px;">${p.empleadoNombre}</td>
            <td style="padding:10px 14px;text-align:right;color:#666;">${fmtNom(p.montoTotal)}</td>
            <td style="padding:10px 14px;text-align:right;color:#38a169;">${fmtNom(p.montoTotal - p.saldo)}</td>
            <td style="padding:10px 14px;text-align:right;font-weight:700;color:${saldado ? '#38a169' : '#e53e3e'};">${fmtNom(p.saldo)}</td>
            <td style="padding:10px 14px;text-align:right;color:#444;">${fmtNom(p.descuentoSemanal)}/sem</td>
            <td style="padding:10px 14px;text-align:center;">
                <span style="background:${saldado ? '#f0fff4' : '#fff5f5'};color:${saldado ? '#38a169' : '#e53e3e'};padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;">
                    ${saldado ? '✅ Saldado' : '⏳ Pendiente'}
                </span>
            </td>
            <td style="padding:10px 14px;text-align:center;">
                ${!saldado ? `<button class="action-btn btn-edit" onclick="abonarPrestamo('${p.id}')">+ Abono</button>` : ""}
                <button class="action-btn btn-delete" onclick="deletePrestamo('${p.id}')">🗑️</button>
            </td>`;
        body.appendChild(row);
    });
}

async function savePrestamo() {
    const empleadoId = document.getElementById("prestamo-empleado").value;
    const monto = document.getElementById("prestamo-monto").value;
    const descuento = document.getElementById("prestamo-descuento").value;
    const errorEl = document.getElementById("prestamo-error");
    errorEl.textContent = "";

    if (!empleadoId) { errorEl.style.color = "#e53e3e"; errorEl.textContent = "⚠️ Seleccione un empleado."; return; }
    if (!monto || parseFloat(monto) <= 0) { errorEl.style.color = "#e53e3e"; errorEl.textContent = "⚠️ Ingrese el monto del préstamo."; return; }
    if (!descuento || parseFloat(descuento) <= 0) { errorEl.style.color = "#e53e3e"; errorEl.textContent = "⚠️ Ingrese el descuento semanal."; return; }

    const data = getNomData();
    if (!data.prestamos) data.prestamos = [];
    const emp = (data.empleados || []).find(e => e.id === empleadoId);

    data.prestamos.unshift({
        id: "prest_" + Date.now(),
        empleadoId,
        empleadoNombre: emp?.nombre || "",
        montoTotal: parseFloat(monto),
        saldo: parseFloat(monto),
        descuentoSemanal: parseFloat(descuento),
        abonos: [],
        createdAt: new Date().toISOString()
    });

    await saveNomData(data);
    document.getElementById("prestamo-monto").value = "";
    document.getElementById("prestamo-descuento").value = "";
    document.getElementById("prestamo-empleado").value = "";
    errorEl.style.color = "#38a169";
    errorEl.textContent = `✅ Préstamo registrado para ${emp?.nombre}.`;
    setTimeout(() => errorEl.textContent = "", 3000);
    renderPrestamos(data.prestamos);
}

async function abonarPrestamo(id) {
    const monto = prompt("¿Cuánto desea abonar al préstamo?");
    if (!monto || isNaN(monto) || parseFloat(monto) <= 0) return;
    const data = getNomData();
    const idx = (data.prestamos || []).findIndex(p => p.id === id);
    if (idx === -1) return;
    data.prestamos[idx].saldo = Math.max(0, data.prestamos[idx].saldo - parseFloat(monto));
    data.prestamos[idx].abonos.push({ monto: parseFloat(monto), fecha: new Date().toISOString() });
    await saveNomData(data);
    renderPrestamos(data.prestamos);
}

async function deletePrestamo(id) {
    if (!confirm("¿Eliminar este préstamo?")) return;
    const data = getNomData();
    data.prestamos = (data.prestamos || []).filter(p => p.id !== id);
    await saveNomData(data);
    renderPrestamos(data.prestamos);
}

// Get commissions earned by employee in a week
function getComisionesEmpleado(empleadoNombre, semanaInicio, semanaFin) {
    const data = getNomData();
    const ventas = data.serviceSales || [];
    const comisiones = data.comisiones || [];
    let totalComision = 0;
    const detalle = [];

    // Filter sales where soldBy matches employee name and date is in week range
    const ventasSemana = ventas.filter(v => {
        if (!v.soldBy || !v.date) return false;
        const soldByNorm = v.soldBy.trim().toLowerCase();
        const empNorm = empleadoNombre.trim().toLowerCase();
        return soldByNorm === empNorm && v.date >= semanaInicio && v.date <= semanaFin;
    });

    ventasSemana.forEach(v => {
        // First check comisiones table, then fall back to service definition
        const comisionTabla = comisiones.find(c => c.servicioId === v.serviceId);
        const svcDef = (data.services || []).find(s => s.id === v.serviceId);
        const montoComision = comisionTabla?.monto || svcDef?.comision || 0;
        if (montoComision > 0) {
            totalComision += montoComision;
            detalle.push({ servicio: v.serviceName, monto: montoComision, fecha: v.date });
        }
    });

    return { total: totalComision, detalle };
}

// ---- STATS ----
function updateNomStats(data) {
    const empleados = data.empleados || [];
    const historial = data.nominaHistorial || [];

    // Nómina esta semana
    const hoy = new Date();
    const inicioSemana = new Date(hoy);
    inicioSemana.setDate(hoy.getDate() - hoy.getDay());
    const inicioStr = inicioSemana.toISOString().split("T")[0];

    const estaSemanaPagos = historial.filter(h => h.semanaInicio === inicioStr);
    const totalSemana = estaSemanaPagos.reduce((sum, h) => sum + (h.neto || 0), 0);
    const pendientes = estaSemanaPagos.filter(h => !h.pagado).length;
    const faltas = estaSemanaPagos.reduce((sum, h) => sum + (h.faltas || 0), 0);

    const elTotal = document.getElementById("nom-stat-empleados");
    const elSemana = document.getElementById("nom-stat-semana");
    const elPend = document.getElementById("nom-stat-pendientes");
    const elFaltas = document.getElementById("nom-stat-faltas");

    if (elTotal) elTotal.textContent = empleados.length;
    if (elSemana) elSemana.textContent = fmtNom(totalSemana);
    if (elPend) elPend.textContent = pendientes;
    if (elFaltas) elFaltas.textContent = faltas;
}

// ---- SAVE EMPLEADO ----
async function saveEmpleado(id) {
    const nombre = document.getElementById("emp-nombre").value.trim();
    const puesto = document.getElementById("emp-puesto").value.trim();
    const tipoPago = document.getElementById("emp-tipo-pago").value;
    const salario = document.getElementById("emp-salario").value;
    const horasDia = document.getElementById("emp-horas-dia").value;
    const diasSemana = document.getElementById("emp-dias-semana").value;
    const telefono = document.getElementById("emp-telefono").value.trim();
    const imss = document.getElementById("emp-imss").value;
    const isr = document.getElementById("emp-isr").value;
    const ingreso = document.getElementById("emp-ingreso").value;
    const errorEl = document.getElementById("emp-error");

    errorEl.textContent = "";
    if (!nombre) { errorEl.textContent = "⚠️ El nombre es requerido."; return; }
    if (!salario || parseFloat(salario) < 0) { errorEl.textContent = "⚠️ Ingrese un salario válido."; return; }

    const data = getNomData();
    if (!data.empleados) data.empleados = [];

    const empleado = {
        id: id || generateNomId(),
        nombre, puesto, tipoPago,
        salario: parseFloat(salario),
        horasDia: parseInt(horasDia) || 8,
        diasSemana: parseInt(diasSemana) || 6,
        telefono,
        imss: parseFloat(imss) || 0,
        isr: parseFloat(isr) || 0,
        ingreso,
        activo: true,
        creadoEn: new Date().toISOString()
    };

    if (id) {
        const idx = data.empleados.findIndex(e => e.id === id);
        if (idx !== -1) data.empleados[idx] = empleado;
    } else {
        data.empleados.push(empleado);
    }

    await saveNomData(data);

    // Clear form
    ["emp-nombre","emp-puesto","emp-salario","emp-telefono"].forEach(id => {
        const el = document.getElementById(id); if (el) el.value = "";
    });
    document.getElementById("emp-imss").value = "3.5";
    document.getElementById("emp-isr").value = "0";
    document.getElementById("emp-horas-dia").value = "8";
    document.getElementById("emp-dias-semana").value = "6";

    errorEl.style.color = "#38a169";
    errorEl.textContent = `✅ Empleado "${nombre}" guardado correctamente.`;
    setTimeout(() => { errorEl.textContent = ""; errorEl.style.color = "#e53e3e"; }, 3000);

    updateNomStats(data);
    renderEmpleados(data.empleados);
}

// ---- INIT SEMANA ----
function initNominaSemana() {
    // Set current week Monday
    const hoy = new Date();
    const dia = hoy.getDay();
    const lunes = new Date(hoy);
    lunes.setDate(hoy.getDate() - (dia === 0 ? 6 : dia - 1));
    const domingo = new Date(lunes);
    domingo.setDate(lunes.getDate() + 6);

    const lunesStr = lunes.toISOString().split("T")[0];
    const domingoStr = domingo.toISOString().split("T")[0];

    const inicioEl = document.getElementById("nom-semana-inicio");
    const finEl = document.getElementById("nom-semana-fin");
    if (inicioEl && !inicioEl.value) inicioEl.value = lunesStr;
    if (finEl) finEl.value = domingoStr;

    loadNominaSemanal();
}

// ---- CALC ROW ----
function calcNomRow(empId) {
    const data = getNomData();
    const emp = (data.empleados || []).find(e => e.id === empId);
    if (!emp) return;

    const dias = parseFloat(document.getElementById(`dias-${empId}`)?.value || 0);
    const faltas = parseFloat(document.getElementById(`faltas-${empId}`)?.value || 0);
    const retardos = parseFloat(document.getElementById(`retardos-${empId}`)?.value || 0);
    const hExtra = parseFloat(document.getElementById(`hextra-${empId}`)?.value || 0);
    const bono = parseFloat(document.getElementById(`bono-${empId}`)?.value || 0);

    let percepciones = 0;
    let deducciones = 0;
    let comisionTotal = 0;

    // Get week dates for commission calculation
    const semanaInicio = document.getElementById("nom-semana-inicio")?.value || "";
    const semanaFin = document.getElementById("nom-semana-fin")?.value || "";

    if (emp.tipoPago === "fijo") {
        // Sueldo fijo — no commissions
        const salarioDiario = emp.salario / (emp.diasSemana || 6);
        const salarioBase = salarioDiario * dias;
        const deducFaltas = salarioDiario * faltas;
        const deducRetardos = (salarioDiario / (emp.horasDia || 8)) * 0.5 * retardos;
        const pagoHExtra = (salarioDiario / (emp.horasDia || 8)) * 1.5 * hExtra;
        percepciones = salarioBase + pagoHExtra + bono;
        deducciones = deducFaltas + deducRetardos;

    } else if (emp.tipoPago === "comision") {
        // Solo comisión — get from services module
        if (semanaInicio && semanaFin) {
            const result = getComisionesEmpleado(emp.nombre, semanaInicio, semanaFin);
            comisionTotal = result.total;
        }
        percepciones = comisionTotal + bono;
        deducciones = 0;

    } else if (emp.tipoPago === "mixto") {
        // Sueldo base + comisión
        const salarioDiario = emp.salario / (emp.diasSemana || 6);
        const salarioBase = salarioDiario * dias;
        const deducFaltas = salarioDiario * faltas;
        const deducRetardos = (salarioDiario / (emp.horasDia || 8)) * 0.5 * retardos;
        const pagoHExtra = (salarioDiario / (emp.horasDia || 8)) * 1.5 * hExtra;

        if (semanaInicio && semanaFin) {
            const result = getComisionesEmpleado(emp.nombre, semanaInicio, semanaFin);
            comisionTotal = result.total;
        }

        percepciones = salarioBase + pagoHExtra + comisionTotal + bono;
        deducciones = deducFaltas + deducRetardos;
    }

    // IMSS & ISR
    const deducIMSS = (percepciones * (emp.imss || 0)) / 100;
    const deducISR = (percepciones * (emp.isr || 0)) / 100;
    deducciones += deducIMSS + deducISR;

    const neto = Math.max(0, percepciones - deducciones);

    const percEl = document.getElementById(`percepciones-${empId}`);
    const dedEl = document.getElementById(`deducciones-${empId}`);
    const netoEl = document.getElementById(`neto-${empId}`);
    const comEl = document.getElementById(`comision-${empId}`);

    if (percEl) percEl.textContent = fmtNom(percepciones);
    if (dedEl) dedEl.textContent = fmtNom(deducciones);
    if (netoEl) netoEl.textContent = fmtNom(neto);
    if (comEl) {
        comEl.textContent = comisionTotal > 0 ? fmtNom(comisionTotal) : "—";
        comEl.style.color = comisionTotal > 0 ? "#38a169" : "#aaa";
    }

    // Services breakdown count
    const svcCountEl = document.getElementById(`servicios-count-${empId}`);
    if (svcCountEl && semanaInicio && semanaFin) {
        const result = getComisionesEmpleado(emp.nombre, semanaInicio, semanaFin);
        const count = result.detalle.length;
        svcCountEl.innerHTML = count > 0
            ? `<span style="background:#f0f4ff;color:#4f46e5;padding:2px 8px;border-radius:12px;font-size:12px;font-weight:600;cursor:pointer;" onclick="showServiciosDetalle('${empId}')">${count} srv</span>`
            : `<span style="color:#ccc;">—</span>`;
        svcCountEl.title = result.detalle.map(d => d.servicio).join(", ");
    }

    // Loan deduction
    const data2 = getNomData();
    const prestamos = (data2.prestamos || []).filter(p => p.empleadoId === empId && p.saldo > 0);
    const descPrestamo = prestamos.reduce((sum, p) => sum + Math.min(p.descuentoSemanal, p.saldo), 0);
    const prestDescEl = document.getElementById(`prestamo-desc-${empId}`);
    if (prestDescEl) {
        prestDescEl.textContent = descPrestamo > 0 ? `- ${fmtNom(descPrestamo)}` : "—";
        prestDescEl.style.color = descPrestamo > 0 ? "#e53e3e" : "#aaa";
    }

    // Recalc neto with loan deduction
    const netoConPrestamo = Math.max(0, neto - descPrestamo);
    if (netoEl) netoEl.textContent = fmtNom(netoConPrestamo);

    updateNomTotals();
}

// Show services detail popup
function showServiciosDetalle(empId) {
    const data = getNomData();
    const emp = (data.empleados || []).find(e => e.id === empId);
    if (!emp) return;
    const semanaInicio = document.getElementById("nom-semana-inicio")?.value || "";
    const semanaFin = document.getElementById("nom-semana-fin")?.value || "";
    if (!semanaInicio) return;
    const result = getComisionesEmpleado(emp.nombre, semanaInicio, semanaFin);
    if (result.detalle.length === 0) {
        alert(`${emp.nombre} no tiene servicios registrados esta semana.`);
        return;
    }
    const detalleStr = result.detalle.map(d => "• " + d.servicio + " — " + fmtNom(d.monto) + " (" + d.fecha + ")").join("\n");
    alert("Servicios realizados por " + emp.nombre + ":\n\n" + detalleStr + "\n\nTotal comisiones: " + fmtNom(result.total));
}

// ---- UPDATE TOTALS ----
function updateNomTotals() {
    const data = getNomData();
    const empleados = data.empleados || [];
    let totalCom = 0, totalPerc = 0, totalDed = 0, totalPrest = 0, totalNeto = 0;

    empleados.forEach(emp => {
        const comText = document.getElementById(`comision-${emp.id}`)?.textContent || "0";
        const com = parseFloat(comText.replace(/[^0-9.]/g,"")) || 0;
        const perc = parseFloat(document.getElementById(`percepciones-${emp.id}`)?.textContent?.replace(/[^0-9.]/g,"") || 0);
        const ded = parseFloat(document.getElementById(`deducciones-${emp.id}`)?.textContent?.replace(/[^0-9.]/g,"") || 0);
        const prestText = document.getElementById(`prestamo-desc-${emp.id}`)?.textContent || "0";
        const prest = parseFloat(prestText.replace(/[^0-9.]/g,"")) || 0;
        const neto = parseFloat(document.getElementById(`neto-${emp.id}`)?.textContent?.replace(/[^0-9.]/g,"") || 0);
        totalCom += com;
        totalPerc += perc;
        totalDed += ded;
        totalPrest += prest;
        totalNeto += neto;
    });

    // Count total services
    let totalSvcCount = 0;
    const semI = document.getElementById("nom-semana-inicio")?.value || "";
    const semF = document.getElementById("nom-semana-fin")?.value || "";
    if (semI && semF) {
        getNomData().empleados?.forEach(emp => {
            const r = getComisionesEmpleado(emp.nombre, semI, semF);
            totalSvcCount += r.detalle.length;
        });
    }

    const tsEl = document.getElementById("total-servicios");
    const tcEl = document.getElementById("total-comisiones");
    const tpEl = document.getElementById("total-percepciones");
    const tdEl = document.getElementById("total-deducciones");
    const tprEl = document.getElementById("total-prestamos");
    const tnEl = document.getElementById("total-neto");
    if (tsEl) tsEl.textContent = totalSvcCount > 0 ? totalSvcCount + " srv" : "—";
    if (tcEl) tcEl.textContent = fmtNom(totalCom);
    if (tpEl) tpEl.textContent = fmtNom(totalPerc);
    if (tdEl) tdEl.textContent = fmtNom(totalDed);
    if (tprEl) tprEl.textContent = fmtNom(totalPrest);
    if (tnEl) tnEl.textContent = fmtNom(totalNeto);
}

// ---- SAVE NOMINA SEMANAL ----
async function saveNominaSemanal() {
    const data = getNomData();
    const empleados = data.empleados || [];
    const inicioEl = document.getElementById("nom-semana-inicio");
    const finEl = document.getElementById("nom-semana-fin");
    if (!inicioEl?.value) { alert("⚠️ Seleccione la semana primero."); return; }

    if (!data.nominaHistorial) data.nominaHistorial = [];

    // Remove existing entries for this week
    data.nominaHistorial = data.nominaHistorial.filter(h => h.semanaInicio !== inicioEl.value);

    empleados.forEach(emp => {
        const dias = parseFloat(document.getElementById(`dias-${emp.id}`)?.value || 0);
        const faltas = parseFloat(document.getElementById(`faltas-${emp.id}`)?.value || 0);
        const retardos = parseFloat(document.getElementById(`retardos-${emp.id}`)?.value || 0);
        const hExtra = parseFloat(document.getElementById(`hextra-${emp.id}`)?.value || 0);
        const bono = parseFloat(document.getElementById(`bono-${emp.id}`)?.value || 0);
        const pagado = document.getElementById(`pagado-${emp.id}`)?.checked || false;

        const percText = document.getElementById(`percepciones-${emp.id}`)?.textContent?.replace(/[^0-9.]/g,"") || "0";
        const dedText = document.getElementById(`deducciones-${emp.id}`)?.textContent?.replace(/[^0-9.]/g,"") || "0";
        const netoText = document.getElementById(`neto-${emp.id}`)?.textContent?.replace(/[^0-9.]/g,"") || "0";

        const comText = document.getElementById(`comision-${emp.id}`)?.textContent?.replace(/[^0-9.]/g,"") || "0";

        const prestDescText = document.getElementById(`prestamo-desc-${emp.id}`)?.textContent?.replace(/[^0-9.]/g,"") || "0";
        const descPrestamo = parseFloat(prestDescText) || 0;

        // Apply weekly loan deduction
        if (descPrestamo > 0) {
            const prestIdx = (data.prestamos || []).findIndex(p => p.empleadoId === emp.id && p.saldo > 0);
            if (prestIdx !== -1) {
                const abono = Math.min(data.prestamos[prestIdx].descuentoSemanal, data.prestamos[prestIdx].saldo);
                data.prestamos[prestIdx].saldo = Math.max(0, data.prestamos[prestIdx].saldo - abono);
                data.prestamos[prestIdx].abonos.push({ monto: abono, fecha: new Date().toISOString(), tipo: "descuento_nomina" });
            }
        }

        const bonoNota = document.getElementById("bono-nota-" + emp.id)?.value.trim() || "";

        data.nominaHistorial.unshift({
            id: generateNomId(),
            semanaInicio: inicioEl.value,
            semanaFin: finEl.value,
            empleadoId: emp.id,
            empleadoNombre: emp.nombre,
            puesto: emp.puesto,
            tipoPago: emp.tipoPago,
            diasTrabajados: dias,
            faltas, retardos,
            horasExtra: hExtra,
            bono, bonoNota,
            comisionTotal: parseFloat(comText),
            descPrestamo,
            percepciones: parseFloat(percText),
            deducciones: parseFloat(dedText),
            neto: parseFloat(netoText),
            pagado,
            creadoEn: new Date().toISOString()
        });
    });

    await saveNomData(data);
    updateNomStats(data);

    // Show success
    const btn = document.querySelector("#nom-tab-semana .settings-btn-primary");
    if (btn) {
        const orig = btn.textContent;
        btn.textContent = "✅ ¡Nómina Guardada!";
        btn.style.background = "#38a169";
        setTimeout(() => { btn.textContent = orig; btn.style.background = "#4f46e5"; }, 3000);
    }
}

// ---- LOAD HISTORIAL ----
function loadNominaHistorial() {
    const data = getNomData();
    const historial = data.nominaHistorial || [];
    const empleados = data.empleados || [];

    // Populate employee filter
    const filtroEl = document.getElementById("nom-hist-empleado");
    if (filtroEl) {
        const current = filtroEl.value;
        filtroEl.innerHTML = '<option value="">Todos los Empleados</option>';
        empleados.forEach(emp => {
            const opt = document.createElement("option");
            opt.value = emp.id; opt.textContent = emp.nombre;
            if (emp.id === current) opt.selected = true;
            filtroEl.appendChild(opt);
        });
    }

    renderNominaHistorial(historial);
}

function filterNominaHistorial() {
    const data = getNomData();

    if (filtro) historial = historial.filter(h => h.empleadoId === filtro);

// ---- MARCAR PAGADO ----
async function marcarPagadoNomina(id) {
    if (!confirm("¿Marcar este pago como realizado?")) return;
    const data = getNomData();
    const idx = (data.nominaHistorial || []).findIndex(h => h.id === id);
    if (idx !== -1) {
        data.nominaHistorial[idx].pagado = true;
        data.nominaHistorial[idx].fechaPago = new Date().toISOString();
    }
    await saveNomData(data);
    updateNomStats(data);
    loadNominaHistorial();
}

<script>
// ============================================
// MARKETING REPORT
// ============================================
function loadMarketingReport() {
    const data = JSON.parse(sessionStorage.getItem("appData"));
    const clients = data.clients || [];
    const sales = data.serviceSales || [];
    const services = data.services || [];
    const currency = data.settings?.currency || "MXN";
    function fmt(n) { return `$${parseFloat(n||0).toFixed(2)} ${currency}`; }

    // Populate service filter
    const svcFilter = document.getElementById("mkt-servicio-filter");
    if (svcFilter && svcFilter.options.length <= 1) {
        services.forEach(s => {
            const opt = document.createElement("option");
            opt.value = s.name; opt.textContent = s.name;
            svcFilter.appendChild(opt);
        });
    }
    const filterServicio = svcFilter?.value || "";

    // Only clients with email
    const clientsWithEmail = clients.filter(c => c.email && c.email.trim() !== "");

    // Match clients to their service sales
    const reportData = clientsWithEmail.map(client => {
        let clientSales = sales.filter(s => {
            // Match by client name in soldBy or by checking reception history
            const rec = (client.receptions || []);
            const svcHistory = (client.serviceHistory || []);
            return svcHistory.some(h => h.service && s.serviceName && h.service.includes(s.serviceName));
        });

        // Also match by name directly
        const nameSales = sales.filter(s =>
            s.soldBy && client.name &&
            s.soldBy.toLowerCase().includes(client.name.toLowerCase().split(" ")[0])
        );

        const allSales = [...new Map([...clientSales, ...nameSales].map(s => [s.id, s])).values()];
        const filteredSales = filterServicio ? allSales.filter(s => s.serviceName === filterServicio) : allSales;

        if (filteredSales.length === 0 && filterServicio) return null;

        const totalGastado = allSales.reduce((sum, s) => sum + (s.amount || 0), 0);
        const lastSale = allSales.sort((a,b) => b.date?.localeCompare(a.date))[0];
        const servicioNames = [...new Set(allSales.map(s => s.serviceName))];

        return { client, totalGastado, servicioNames, lastSale, count: allSales.length };
    }).filter(Boolean);

    // Stats
    const statsEl = document.getElementById("mkt-stats");
    if (statsEl) {
        statsEl.innerHTML = `
            <div style="background:#f0f4ff;border-radius:8px;padding:12px 16px;flex:1;text-align:center;">
                <div style="font-size:20px;font-weight:800;color:#4f46e5;">${clientsWithEmail.length}</div>
                <div style="font-size:11px;color:#888;">Clientes con Correo</div>
            </div>
            <div style="background:#f0fff4;border-radius:8px;padding:12px 16px;flex:1;text-align:center;">
                <div style="font-size:20px;font-weight:800;color:#38a169;">${reportData.length}</div>
                <div style="font-size:11px;color:#888;">Con Historial de Servicios</div>
            </div>`;
    }

    const body = document.getElementById("mkt-body");
    const emptyEl = document.getElementById("mkt-empty");
    const table = document.getElementById("mkt-table");

    // Show all clients with email even if no sales
    const allEmailClients = clientsWithEmail.map(client => {
        const existing = reportData.find(r => r.client.id === client.id);
        return existing || { client, totalGastado: 0, servicioNames: [], lastSale: null, count: 0 };
    }).filter(r => !filterServicio || r.count > 0);

    if (allEmailClients.length === 0) {
        table.style.display = "none"; emptyEl.style.display = "block"; return;
    }
    table.style.display = "table"; emptyEl.style.display = "none"; body.innerHTML = "";

    allEmailClients.sort((a,b) => b.count - a.count).forEach(r => {
        const row = document.createElement("tr");
        row.style.borderBottom = "1px solid #f0f0f0";
        row.innerHTML = `
            <td style="padding:10px 14px;font-weight:600;color:#1a1a2e;font-size:14px;">${r.client.name}</td>
            <td style="padding:10px 14px;font-size:13px;color:#4f46e5;">${r.client.email}</td>
            <td style="padding:10px 14px;font-size:13px;color:#666;">${r.client.phone || "—"}</td>
            <td style="padding:10px 14px;text-align:center;">
                ${r.count > 0
                    ? `<span style="background:#f0f4ff;color:#4f46e5;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;">${r.count} servicios</span>`
                    : '<span style="color:#ccc;font-size:12px;">Sin servicios</span>'}
            </td>
            <td style="padding:10px 14px;text-align:right;font-weight:600;color:#38a169;">${r.totalGastado > 0 ? fmt(r.totalGastado) : "—"}</td>
            <td style="padding:10px 14px;font-size:12px;color:#666;">${r.lastSale?.date || "—"}</td>`;
        body.appendChild(row);
    });

    // Store emails for copy
    window._marketingEmails = allEmailClients.map(r => r.client.email).join(", ");
}

function copyEmailList() {
    if (!window._marketingEmails) { alert("No hay correos para copiar."); return; }
    navigator.clipboard.writeText(window._marketingEmails).then(() => {
        alert(`✅ ${window._marketingEmails.split(",").length} correos copiados al portapapeles!`);
    });
}

// ============================================
function loadEmployeeReport() {

    const empleados = data.empleados || [];
    const historial = data.nominaHistorial || [];
    const sales = data.serviceSales || [];
    const currency = data.settings?.currency || "MXN";
    function fmt(n) { return `$${parseFloat(n||0).toFixed(2)} ${currency}`; }

    const period = document.getElementById("emp-report-period")?.value || "week";
    const fromEl = document.getElementById("emp-report-from");
    const toEl = document.getElementById("emp-report-to");

    // Show/hide date inputs
    if (fromEl) fromEl.style.display = period === "custom" ? "block" : "none";
    if (toEl) toEl.style.display = period === "custom" ? "block" : "none";

    // Calculate date range
    const today = new Date();
    let fromDate, toDate;

    if (period === "week") {
        const day = today.getDay();
        const monday = new Date(today);
        monday.setDate(today.getDate() - (day === 0 ? 6 : day - 1));
        fromDate = monday.toISOString().split("T")[0];
        toDate = today.toISOString().split("T")[0];
    } else if (period === "month") {
        fromDate = new Date(today.getFullYear(), today.getMonth(), 1).toISOString().split("T")[0];
        toDate = today.toISOString().split("T")[0];
    } else {
        fromDate = fromEl?.value || "";
        toDate = toEl?.value || "";
        if (!fromDate || !toDate) return;
    }

    const body = document.getElementById("emp-report-body");
    const emptyEl = document.getElementById("emp-report-empty");
    const table = document.getElementById("emp-report-table");

    if (empleados.length === 0) {
        table.style.display = "none"; emptyEl.style.display = "block"; return;
    }

    table.style.display = "table"; emptyEl.style.display = "none"; body.innerHTML = "";

    empleados.forEach(emp => {
        // Filter nomina historial for this employee in date range
        const empHistorial = historial.filter(h =>
            h.empleadoId === emp.id &&
            h.semanaInicio >= fromDate &&
            h.semanaFin <= toDate
        );

        // Filter service sales for this employee
        const empSales = sales.filter(s =>
            s.soldBy === emp.nombre &&
            s.date >= fromDate &&
            s.date <= toDate
        );

        const totalDias = empHistorial.reduce((sum, h) => sum + (h.diasTrabajados || 0), 0);
        const totalComisiones = empHistorial.reduce((sum, h) => sum + (h.comisionTotal || 0), 0);
        const totalPercepciones = empHistorial.reduce((sum, h) => sum + (h.percepciones || 0), 0);
        const totalDeducciones = empHistorial.reduce((sum, h) => sum + (h.deducciones || 0), 0);
        const totalNeto = empHistorial.reduce((sum, h) => sum + (h.neto || 0), 0);
        const semanas = empHistorial.length;

        const row = document.createElement("tr");
        row.style.borderBottom = "1px solid #f0f0f0";
        row.innerHTML = `
            <td style="padding:10px 14px;font-weight:600;color:#1a1a2e;font-size:14px;">
                ${emp.nombre}
                <div style="font-size:11px;color:#888;">${emp.tipoPago === 'fijo' ? 'Sueldo Fijo' : emp.tipoPago === 'comision' ? 'Solo Comisión' : 'Base + Comisión'}</div>
            </td>
            <td style="padding:10px 14px;font-size:13px;color:#666;">${emp.puesto || "—"}</td>
            <td style="padding:10px 14px;text-align:center;font-size:13px;">${totalDias}</td>
            <td style="padding:10px 14px;text-align:center;">
                <span style="background:#f0f4ff;color:#4f46e5;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;">${empSales.length} srv</span>
            </td>
            <td style="padding:10px 14px;text-align:right;font-weight:600;color:#38a169;">${fmt(totalComisiones)}</td>
            <td style="padding:10px 14px;text-align:right;color:#444;">${fmt(totalPercepciones)}</td>
            <td style="padding:10px 14px;text-align:right;color:#e53e3e;">${fmt(totalDeducciones)}</td>
            <td style="padding:10px 14px;text-align:right;font-weight:800;color:#4f46e5;">${fmt(totalNeto)}</td>
            <td style="padding:10px 14px;text-align:center;color:#666;">${semanas}</td>`;
        body.appendChild(row);
    });
}
</script>

                    const { getFirestore, doc, getDoc } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js");

                    const firebaseConfig = {
                        apiKey: "AIzaSyBevSvWNUBHCZRgRrthlTicy2_Dap_US84",
                        authDomain: "carwash-crm-cdf50.firebaseapp.com",
                        projectId: "carwash-crm-cdf50",
                        storageBucket: "carwash-crm-cdf50.firebasestorage.app",
                        messagingSenderId: "219035211353",
                        appId: "1:219035211353:web:4d1a5c11e0a6fd11a1c348"
                    };

                    const app = initializeApp(firebaseConfig, "restore-check");
                    const auth = getAuth(app);

// ============================================
// BACKUP & RESTORE
// ============================================
async function exportBackup() {
    const msgEl = document.getElementById("backup-message");
    try {
        const data = JSON.parse(sessionStorage.getItem("appData"));
        if (!data) { msgEl.style.color = "#e53e3e"; msgEl.textContent = "⚠️ No hay datos en la sesión actual."; return; }

        // Add metadata
        const backup = {
            _backup: true,
            _version: "1.0",
            _exportedAt: new Date().toISOString(),
            _app: "Business Manager",
            ...data
        };

        const blob = new Blob([JSON.stringify(backup, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        const fecha = new Date().toISOString().split("T")[0];
        a.href = url;
        a.download = `backup-business-manager-${fecha}.json`;
        a.click();
        URL.revokeObjectURL(url);

        msgEl.style.color = "#38a169";
        msgEl.textContent = `✅ Respaldo exportado: backup-business-manager-${fecha}.json`;
        setTimeout(() => msgEl.textContent = "", 5000);

    } catch(e) {
        msgEl.style.color = "#e53e3e";
        msgEl.textContent = "❌ Error al exportar: " + e.message;
    }
}

async function importBackup(event) {
    const msgEl = document.getElementById("backup-message");
    const file = event.target.files[0];
    if (!file) return;

    if (!confirm("⚠️ Importar este respaldo reemplazará TODOS los datos actuales. ¿Está seguro?")) {
        event.target.value = "";
        return;
    }

    try {
        const text = await file.text();
        const backup = JSON.parse(text);

        if (!backup._backup) {
            msgEl.style.color = "#e53e3e";
            msgEl.textContent = "❌ El archivo no es un respaldo válido de Business Manager.";
            return;
        }

        // Remove metadata keys
        delete backup._backup;
        delete backup._version;
        delete backup._exportedAt;
        delete backup._app;

        // Save to session and encrypt to localStorage
        sessionStorage.setItem("appData", JSON.stringify(backup));
        const saved = await DB.save(backup);

        if (!saved) {
            msgEl.style.color = "#e53e3e";
            msgEl.textContent = "❌ Error al guardar. Verifique que su sesión esté activa.";
            return;
        }

        msgEl.style.color = "#38a169";
        msgEl.textContent = "✅ ¡Respaldo importado correctamente! Recargando...";

        setTimeout(() => {
            if (typeof buildSidebar === "function") buildSidebar();
            if (typeof loadDefaultModule === "function") loadDefaultModule();
        }, 1500);

    } catch(e) {
        msgEl.style.color = "#e53e3e";
        msgEl.textContent = "❌ Error al importar: " + e.message;
    }

    event.target.value = "";
}
</script>
